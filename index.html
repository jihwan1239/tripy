        + `시각: ${from.time||'낮'} (${ctx.weekday}요일, ${ctx.dayType})\n\n`
        + `삿포로 택시 기본요금과 거리요금, 심야 할증(22시~5시)을 감안해서 알려줘.`;
      const res = await fetch('https://api.openai.com/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+personalKey()},
        body: JSON.stringify({ model:CFG.OPENAI_MODEL, temperature:0.2,
          messages:[{role:'system',content:sys},{role:'user',content:usr}] })
      });
      if(!res.ok) throw new Error('openai '+res.status);
      const j = await res.json();
      const txt=(j.choices&&j.choices[0]&&j.choices[0].message? j.choices[0].message.content:'').replace(/```json|```/g,'').trim();
      data = JSON.parse(txt);
    }
    from.taxiFare = data.fare || '';
    from.taxiNote = data.note || '';
    markChanged();
    box.innerHTML = renderTaxiFare(from.taxiFare, from.taxiNote);
    renderScheduleScreen();
  }catch(e){
    console.warn('[택시 요금]', e);
    box.innerHTML = `<div class="rd-none err">요금을 불러오지 못했어요. 잠시 후 다시 시도해주세요.</div>`;
  }finally{ btn.disabled=false; }
}

function renderAiRoute(d){
  if(!d) return '';
  const steps = Array.isArray(d.steps)? d.steps : [];
  const lis = steps.map(st=>{
    const isWalk = String(st.mode||'').includes('도보');
    return `<li class="rs ${isWalk?'walk':'transit'}">
      <div class="rs-line">${isWalk? `<span class="icon">${iconSvg('walk')}</span>`:''}
        <b>${esc(st.line || st.mode || '')}</b>
        ${!isWalk && st.mode? `<span class="rs-kind">${esc(st.mode)}</span>`:''}</div>
      <div class="rs-body">${esc(st.from||'')} <span class="rs-arrow">→</span> ${esc(st.to||'')}
        ${st.note? ` · ${esc(st.note)}`:''}</div>
    </li>`;
  }).join('');

  const head=[];
  if(d.minutes) head.push(`<span class="rd-dur">약 ${esc(String(d.minutes))}분</span>`);
  if(d.fare)    head.push(`<span class="rd-fare">${esc(String(d.fare))}</span>`);

  return `<div class="ai-route">
      <div class="ai-route-tag">AI 추정 경로</div>
      ${d.summary? `<div class="ai-route-sum">${esc(d.summary)}</div>`:''}
      ${head.length? `<div class="rd-head">${head.join('<span class="rd-sep">·</span>')}</div>`:''}
      ${lis? `<ol class="rd-steps">${lis}</ol>`:''}
      <div class="ai-route-warn">AI가 추정한 경로예요. 지하철·전차 구간은 OpenStreetMap의 실제 선로를 따라
        지도에 그려지지만, <b>시간표와 요금은 AI 추정</b>이라 실제와 다를 수 있어요.
        출발 전에 구글 지도에서 한 번 확인해주세요.${d.caution? ` ${esc(d.caution)}`:''}</div>
    </div>`;
}

function buildLeg(from,to){
  const leg=document.createElement('div'); leg.className='leg';
  const both = !from.tbd && !to.tbd && from.lat!=null && to.lat!=null;
  const km = both? haversineKm(from,to):null;
  const cur = normalizeMode(from.mode);

  const modesHtml = MODES.map(m=>{
    const mins = both? estimateMinutes(km,m.key):null;
    return `<button class="mode ${m.key===cur?'active':''}" data-mode="${m.key}"
      style="--mc:${m.c};--ms:${m.s}">
      <span class="icon">${iconSvg(m.icon)}</span>${m.label}
      ${mins!=null? `<span class="mins" data-mins="${m.key}">${fmtMin(mins)}</span>`:''}</button>`;
  }).join('');

  let meta;
  if(!both) meta='양쪽 위치가 모두 정해지면 소요시간이 계산돼요';
  else if(HAS_DIR) meta=`직선거리 약 ${km.toFixed(1)}km · 경로를 불러오는 중입니다`;
  else meta=`직선거리 약 ${km.toFixed(1)}km · <span class="off">경로 안내 ${DISABLED_MSG}</span> 거리 기반 추정치이며 노선·요금 정보는 표시되지 않아요`;

  leg.innerHTML=`<div class="rail"><span></span><button type="button" class="leg-add" title="여기에 일정 추가">+</button><span></span></div>
    <div class="legbody">
      <div class="modes">${modesHtml}</div>
      <div class="route-detail"></div>
      <div class="legmeta">${meta}</div>
    </div>`;

  leg.querySelector('.leg-add').addEventListener('click', ()=>{
    openForm(null, { time: midTime(from.time, to.time), afterName: from.name, beforeName: to.name });
  });

  leg.querySelectorAll('.mode').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      from.mode=btn.dataset.mode; markChanged();
      renderScheduleScreen();
      renderMapForDay();           // 지도에도 바로 반영
    });
  });

  if(both && HAS_DIR) fillLegDetail(from,to,leg,km);
  return leg;
}

function vehicleIcon(type){
  const t=String(type||'').toUpperCase();
  if(t.includes('BUS')) return 'bus';
  return 'metro';
}
function vehicleLabel(type){
  const t=String(type||'').toUpperCase();
  if(t.includes('BUS')) return '버스';
  if(t.includes('SUBWAY')||t.includes('METRO')) return '지하철';
  if(t.includes('TRAM')||t.includes('STREETCAR')) return '노면전차';
  if(t.includes('RAIL')||t.includes('TRAIN')) return '열차';
  return '대중교통';
}

async function fillLegDetail(from,to,legEl,km){
  const metaEl   = legEl.querySelector('.legmeta');
  const detailEl = legEl.querySelector('.route-detail');
  const cur      = normalizeMode(from.mode);

  // 칩에 표시할 각 수단 소요시간
  const gList=[...new Set(MODES.map(m=>m.g))];
  const routes={};
  await Promise.all(gList.map(async g=>{ routes[g] = await requestRoute(from,to,g); }));

  let anyReal=false;
  MODES.forEach(m=>{
    const el=legEl.querySelector(`.mins[data-mins="${m.key}"]`);
    const r=routes[m.g];
    if(r && r.ok){
      if(m.key!=='transit') legTimes[legKey(from,to,m.key)] = { mins:r.mins, src:'google' };
      if(el){ el.textContent=fmtMin(r.mins); anyReal=true; }
    }
    // 대중교통은 구글이 일본을 지원하지 않으므로 AI 값이 있으면 그걸 씁니다
    if(m.key==='transit' && el && from.aiRoute && from.aiRoute.minutes){
      el.textContent = `약 ${from.aiRoute.minutes}분`;
    }
  });

  const r = routes[modeToG(cur)];

  const gmapLink = `<a class="gmap-btn" href="${gmapsDirUrl(from,to,cur)}" target="_blank" rel="noopener">
      <span class="icon">${iconSvg('navMap')}</span>구글 지도에서 보기</a>`;

  if(!r || !r.ok){
    const stx = r? r.status : 'UNKNOWN_ERROR';

    if(cur==='transit'){
      // 구글 Directions API는 일본 대중교통을 지원하지 않습니다.
      const est = fmtMin(estimateMinutes(km,'transit'));
      const saved = from.aiRoute;
      detailEl.innerHTML = `
        <div class="rd-actions">
          ${gmapLink}
          <button type="button" class="ai-btn" data-ai-route>
            <span class="icon">${iconSvg('star')}</span>${saved? 'AI 경로 다시 받기':'AI로 경로 추정'}
          </button>
        </div>
        <div class="ai-route-box">${saved? renderAiRoute(saved):''}</div>
        <button type="button" class="rd-why" data-why>
          거리 기반 추정 ${est} · 왜 노선이 안 나오나요?
        </button>
        <div class="rd-why-box" hidden>
          구글 경로 안내는 일본만 대중교통을 지원하지 않아요. 그래서 노선·시각표·요금을
          자동으로 가져올 수 없어서, 구글 지도 앱으로 넘어가 확인하거나 AI 추정을 쓰는 방식이에요.
        </div>`;

      const why = detailEl.querySelector('[data-why]');
      const whyBox = detailEl.querySelector('.rd-why-box');
      why.addEventListener('click', ()=>{ whyBox.hidden = !whyBox.hidden; why.classList.toggle('open', !whyBox.hidden); });

      const btn = detailEl.querySelector('[data-ai-route]');
      const box = detailEl.querySelector('.ai-route-box');
      btn.addEventListener('click', ()=> askAiRoute(from,to,btn,box));

      metaEl.innerHTML = `직선거리 약 ${km.toFixed(1)}km`
        + (anyReal? ' · 도보·차량은 구글 경로 기준' : '');
      return;
    }

    const denied = (stx==='REQUEST_DENIED' || stx==='OVER_QUERY_LIMIT');
    detailEl.innerHTML = `<div class="rd-none ${denied?'err':''}">${dirStatusMsg(stx)}</div>
      <div class="rd-actions">${gmapLink}</div>`;
    metaEl.innerHTML = `직선거리 약 ${km.toFixed(1)}km`
      + (anyReal? ' · 다른 수단은 구글 경로 기준' : ' · 추정치로 표시됩니다');
    return;
  }

  // ---- 요약 줄 ----
  const bits=[];
  if(r.depart && r.arrive) bits.push(`<span class="rd-time">${esc(r.depart)} – ${esc(r.arrive)}</span>`);
  bits.push(`<span class="rd-dur">${fmtMin(r.mins)}</span>`);
  if(r.fare) bits.push(`<span class="rd-fare">${esc(r.fare)}</span>`);
  else if(cur==='transit') bits.push(`<span class="rd-fare muted">요금 정보 없음</span>`);
  if(r.distance && cur!=='transit') bits.push(`<span class="rd-dist">${esc(r.distance)}</span>`);

  // ---- 노선 배지 ----
  let chain='';
  const transitSteps = (r.steps||[]).filter(st=>st.kind==='transit');
  if(cur==='transit' && r.steps.length){
    const parts=r.steps.filter(st=> st.kind==='transit' || st.mins>=1).map(st=>{
      if(st.kind!=='transit') return `<span class="rd-seg walk"><span class="icon">${iconSvg('walk')}</span>${st.mins}분</span>`;
      const style = st.color? ` style="background:${esc(st.color)};border-color:${esc(st.color)};color:${esc(st.textColor||'#fff')}"`:'';
      return `<span class="rd-seg line"${style}><span class="icon">${iconSvg(vehicleIcon(st.vehicle))}</span>${esc(st.name)}</span>`;
    });
    if(parts.length) chain=`<div class="rd-chain">${parts.join('<span class="rd-arrow">›</span>')}</div>`;
  }

  // ---- 탑승 카운트다운 ----
  const first = transitSteps[0];
  if(first && first.departAt){
    bits.push(`<span class="rd-board">${esc(first.depart)} ${esc(first.from)} 출발</span>`
      + `<span class="rd-eta" data-dep="${first.departAt}">${etaText(first.departAt)}</span>`);
  }

  // ---- 단계별 안내 ----
  let stepsHtml='';
  if(cur==='transit' && r.steps.length){
    const lis = r.steps.map(st=>{
      if(st.kind==='transit'){
        const dot = st.color? `<i class="rd-dot-color" style="background:${esc(st.color)}"></i>` : '';
        return `<li class="rs transit">
          <div class="rs-line">${dot}<b>${esc(st.name)}</b>
            <span class="rs-kind">${vehicleLabel(st.vehicle)}</span>
            ${st.headsign? `<span class="rs-head">${esc(st.headsign)} 방면</span>`:''}</div>
          <div class="rs-body">${esc(st.from)} <span class="rs-arrow">→</span> ${esc(st.to)}
            ${st.stops? ` · ${st.stops}정거장`:''} · ${fmtMin(st.mins||1)}</div>
          ${st.depart? `<div class="rs-time">${esc(st.depart)} 출발${st.arrive? ` · ${esc(st.arrive)} 도착`:''}</div>`:''}
        </li>`;
      }
      if(st.mins < 1) return '';
      return `<li class="rs walk"><div class="rs-body"><span class="icon">${iconSvg('walk')}</span> 도보 ${fmtMin(st.mins)}${st.dist? ` · ${esc(st.dist)}`:''}</div></li>`;
    }).join('');
    if(lis) stepsHtml = `<ol class="rd-steps">${lis}</ol>`;
  }

  const taxiBtn = (cur==='taxi')
    ? `<button type="button" class="ai-btn" data-ai-taxi>
         <span class="icon">${iconSvg('star')}</span>${from.taxiFare? '요금 다시 계산':'AI로 택시 요금'}
       </button>` : '';

  detailEl.innerHTML =
    `<div class="rd-head">${bits.join('<span class="rd-sep">·</span>')}</div>${chain}${stepsHtml}`
    + `<div class="rd-actions">${gmapLink}${taxiBtn}</div>`
    + `<div class="taxi-box">${from.taxiFare? renderTaxiFare(from.taxiFare, from.taxiNote):''}</div>`;

  const tb = detailEl.querySelector('[data-ai-taxi]');
  if(tb){
    const tbox = detailEl.querySelector('.taxi-box');
    tb.addEventListener('click', ()=> askTaxiFare(from, to, tb, tbox, r));
  }
  tickEtas();

  metaEl.innerHTML = `직선거리 약 ${km.toFixed(1)}km · 구글 경로 기준`
    + (cur==='transit' ? ' · 지금 출발 기준이며 1분마다 갱신돼요' : '');
}

/* 출발까지 남은 시간 (실시간 갱신) */
function etaText(epoch){
  const diff=Math.round((epoch-Date.now())/60000);
  if(diff <= -2) return '출발함';
  if(diff <= 0)  return '곧 출발';
  if(diff < 60)  return `${diff}분 뒤`;
  const h=Math.floor(diff/60), m=diff%60;
  return m? `${h}시간 ${m}분 뒤` : `${h}시간 뒤`;
}
function tickEtas(){
  document.querySelectorAll('.rd-eta').forEach(el=>{
    const dep=Number(el.dataset.dep); if(!dep) return;
    el.textContent=etaText(dep);
    el.classList.toggle('soon', dep-Date.now() < 5*60*1000);
  });
}

/* =========================================================
   항공편 — 입국·출국 공항 일정 자동 생성
   ========================================================= */
const FLIGHT_RULE = {
  arriveBuffer: 60,    // 착륙 후 입국심사·수하물 수취 예상 시간(분)
  checkinLead: 180     // 국제선 출발 몇 분 전에 공항 도착 권장
};

function addMinutes(hhmm, min){
  const m=/^(\d{1,2}):(\d{2})$/.exec(hhmm||'');
  if(!m) return hhmm||'';
  let t=(+m[1])*60+(+m[2])+min;
  t=((t%1440)+1440)%1440;
  return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
}

/* 항공편 정보로 첫날/마지막날 공항 일정을 맞춥니다 */
function ensureFlightStops(){
  const f = TRIP.flights;
  if(!f) return false;
  let changed=false;

  const upsert = (day, kind, data)=>{
    if(!day) return;
    let st = day.stops.find(x=>x.flight===kind);
    if(!st){
      st = { id:newUid(), flight:kind, cat:'이동', mode:'transit' };
      day.stops.push(st);
      changed=true;
    }
    if(st.time!==data.time || st.name!==data.name || st.note!==data.note
       || st.lat!==data.lat || st.lng!==data.lng){
      Object.assign(st, data, { tbd: data.lat==null });
      changed=true;
    }
  };

  const first = TRIP.days[0];
  const last  = TRIP.days[TRIP.days.length-1];

  if(f.in && f.in.time && first){
    const ready = addMinutes(f.in.time, FLIGHT_RULE.arriveBuffer);
    upsert(first, 'in', {
      time: ready,
      name: `${f.in.airport||'공항'} 도착`,
      note: `${f.in.no? f.in.no+' ':''}${f.in.time} 착륙 · 입국심사와 수하물 수취까지 약 ${FLIGHT_RULE.arriveBuffer}분`,
      place: f.in.place||'', lat: f.in.lat!=null? f.in.lat:null, lng: f.in.lng!=null? f.in.lng:null
    });
  }

  if(f.out && f.out.time && last){
    const beAt = addMinutes(f.out.time, -FLIGHT_RULE.checkinLead);
    upsert(last, 'out', {
      time: beAt,
      name: `${f.out.airport||'공항'} 도착 (체크인)`,
      note: `${f.out.no? f.out.no+' ':''}${f.out.time} 출발 · 출발 ${Math.round(FLIGHT_RULE.checkinLead/60)}시간 전 도착 권장`,
      place: f.out.place||'', lat: f.out.lat!=null? f.out.lat:null, lng: f.out.lng!=null? f.out.lng:null
    });
  }

  TRIP.days.forEach(d=> d.stops.sort((a,b)=>a.time.localeCompare(b.time)));
  if(changed) markChanged();
  return changed;
}

async function saveFlights(){
  const v=id=>document.getElementById(id).value.trim();
  const inTime  = document.getElementById('fi_use').checked ? v('fi_time') : '';
  const outTime = document.getElementById('fo_use').checked ? v('fo_time') : '';
  if(!inTime && !outTime){ alert('도착 또는 출발 시각을 하나 이상 입력해주세요.'); return; }

  const prev = TRIP.flights || {};
  const mk = async (no, ap, time, old)=>{
    if(!time) return null;
    const o = { no, airport:ap, time };
    if(old && old.airport===ap && old.lat!=null){ o.lat=old.lat; o.lng=old.lng; o.place=old.place; }
    else if(ap){
      const at = await resolveStation(ap);          // 공항 좌표 찾기
      if(at){ o.lat=at[0]; o.lng=at[1]; o.place=ap; }
    }
    return o;
  };

  TRIP.flights = {
    in:  await mk(v('fi_no'), v('fi_ap'), inTime,  prev.in),
    out: await mk(v('fo_no'), v('fo_ap'), outTime, prev.out)
  };
  ensureFlightStops(); markChanged();
  closeDayForm(); activeStopId=null;
  refreshAll(); renderScheduleScreen();
  toast('항공편을 저장했어요');
}

  TRIP.flights = null;
  TRIP.days.forEach(d=>{ d.stops = d.stops.filter(x=>!x.flight); });

/* =========================================================
   숙소 — 첫날을 제외한 모든 날의 시작을 숙소로
   ========================================================= */
function minusMinutes(hhmm, min){
  const m=/^(\d{1,2}):(\d{2})$/.exec(hhmm||'');
  if(!m) return '08:00';
  let t = (+m[1])*60 + (+m[2]) - min;
  if(t < 0) t = 0;
  return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
}

/* idx번째 날 밤에 묵는 숙소
   — 그 날에 지정된 값이 없으면 이전 날 설정을 이어받습니다 */
function stayForDayIndex(idx){
  for(let i=idx; i>=0; i--){
    const d=TRIP.days[i];
    if(d && d.stay && d.stay.lat!=null) return d.stay;
  }
  return (TRIP.stay && TRIP.stay.lat!=null) ? TRIP.stay : null;
}
/* 그 날의 숙소가 직접 지정된 것인지(=이어받은 게 아닌지) */
function stayIsOwn(idx){
  const d=TRIP.days[idx];
  return !!(d && d.stay && d.stay.lat!=null);
}

/* 각 날의 첫 일정을 '전날 묵은 숙소'에서 출발하도록 맞춥니다 */
function ensureStayStarts(){
  let changed=false;

  TRIP.days.forEach((d, idx)=>{
    if(idx===0){                       // 첫날은 도착일이라 제외
      const had = d.stops.length;
      d.stops = d.stops.filter(x=>!x.stay);
      if(d.stops.length!==had) changed=true;
      return;
    }

    const stay = stayForDayIndex(idx-1);   // 전날 밤 묵은 곳
    const existing = d.stops.find(x=>x.stay);

    if(!stay){
      if(existing){ d.stops = d.stops.filter(x=>!x.stay); changed=true; }
      return;
    }

    if(existing){
      if(existing.name!==stay.name || existing.lat!==stay.lat || existing.lng!==stay.lng){
        existing.name=stay.name; existing.place=stay.place||'';
        existing.lat=stay.lat; existing.lng=stay.lng; existing.tbd=false;
        changed=true;
      }
      return;
    }

    if(d.noStay) return;                   // 사용자가 지운 날은 다시 넣지 않음

    const first = d.stops[0];
    const t = first ? minusMinutes(first.time, 30) : '08:00';
    d.stops.unshift({
      id:newUid(), time:t, name:stay.name, note:'숙소에서 출발',
      cat:'숙소', place:stay.place||'', lat:stay.lat, lng:stay.lng,
      mode:'walk', stay:true
    });
    d.stops.sort((a,b)=>a.time.localeCompare(b.time));
    changed=true;
  });

  if(changed) markChanged();
  return changed;
}

  TRIP.days.forEach((d,i)=>{ if(i>idx) delete d.noStay; });

function clearStay(){

  return d.toISOString().slice(0,10);
}

/* =========================================================
   시간 입력 — 탭으로 고르는 방식 (모바일 키패드 없이)
   ========================================================= */
function clampTime(hhmm){
  const m=/^(\d{1,2}):(\d{2})$/.exec(hhmm||'');
  if(!m) return '09:00';
  const h=Math.min(23,Math.max(0,+m[1])), mi=Math.min(59,Math.max(0,+m[2]));
  return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;
}

/* 12시간제 / 24시간제 — 기기에 저장되는 개인 설정 */
let TIME_FMT = (()=>{ try{ return localStorage.getItem('sapporo:timeFmt')==='12' ? 12 : 24; }catch(e){ return 24; } })();
function setTimeFmt(v){
  TIME_FMT = v;
  try{ localStorage.setItem('sapporo:timeFmt', String(v)); }catch(e){}
}

function to12(hhmm){
  const [H,M] = clampTime(hhmm).split(':').map(Number);
  const pm = H >= 12;
  let h12 = H % 12; if(h12===0) h12 = 12;
  return { h12, min:M, pm };
}
function from12(h12, min, pm){
  let H = h12 % 12;
  if(pm) H += 12;
  return `${String(H).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
}
/* 화면에 보여줄 문자열 */
function displayTime(hhmm){
  if(TIME_FMT===24) return clampTime(hhmm);
  const t = to12(hhmm);
  return `${String(t.h12).padStart(2,'0')}:${String(t.min).padStart(2,'0')}`;
}
/* 목록·카드 등에서 쓰는 표기 (오전/오후 포함) */
function fmtClock(hhmm){
  if(TIME_FMT===24) return clampTime(hhmm);
  const t = to12(hhmm);
  return `${t.pm?'오후':'오전'} ${t.h12}:${String(t.min).padStart(2,'0')}`;
}

/* 숫자 입력 해석 — 현재 선택된 형식 기준 */
function digitsToTime(d, pmHint){
  const s=String(d||'').replace(/\D/g,'').slice(0,4);
  if(!s) return null;
  let h, m;
  if(s.length<=2){ h=+s; m=0; }
  else if(s.length===3){ h=+s.slice(0,1); m=+s.slice(1); }
  else { h=+s.slice(0,2); m=+s.slice(2); }
  if(m>59) return null;

  if(TIME_FMT===24){
    if(h>23) return null;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }
  if(h<1 || h>12) return null;
  return from12(h, m, !!pmHint);
}

function timeFieldHtml(id, value){
  const v = clampTime(value || '09:00');
  const t = to12(v);
  return `
    <div class="tf ${TIME_FMT===12?'h12':'h24'}" data-tf="${id}">
      <input type="hidden" id="${id}" value="${v}">
      <div class="tf-box">
        <input class="tf-input" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="5" value="${displayTime(v)}" placeholder="${TIME_FMT===12?'230':'1430'}"
               autocomplete="off" enterkeyhint="done">
      </div>
      <div class="tf-ctrl">
        <div class="tf-seg tf-ampm">
          <button type="button" class="${t.pm?'':'on'}" data-ampm="am">오전</button>

        </div>
        <div class="tf-seg tf-fmt">
          <button type="button" class="${TIME_FMT===24?'on':''}" data-fmt="24">24h</button>
          <button type="button" class="${TIME_FMT===12?'on':''}" data-fmt="12">12h</button>
        </div>
      </div>
    </div>`;
}

function bindTimeField(id){
  const root = document.querySelector(`.tf[data-tf="${id}"]`);
  if(!root) return;
  const hidden = document.getElementById(id);
  const box = root.querySelector('.tf-input');

  const paint = ()=>{
    const t = to12(hidden.value);
    box.value = displayTime(hidden.value);
    box.placeholder = TIME_FMT===12 ? '230' : '1430';
    root.classList.toggle('h12', TIME_FMT===12);
    root.classList.toggle('h24', TIME_FMT===24);
    root.querySelectorAll('[data-ampm]').forEach(b=>
      b.classList.toggle('on', (b.dataset.ampm==='pm') === t.pm));
    root.querySelectorAll('[data-fmt]').forEach(b=>
      b.classList.toggle('on', +b.dataset.fmt === TIME_FMT));
  };

  const isPm = ()=> !!root.querySelector('[data-ampm="pm"].on');

  box.addEventListener('input', ()=>{
    const d = box.value.replace(/\D/g,'').slice(0,4);
    box.value = d.length>2 ? `${d.slice(0,d.length-2)}:${d.slice(-2)}` : d;
    const t = digitsToTime(box.value, isPm());
    if(t){ hidden.value = t; root.classList.remove('bad'); }
    else { root.classList.add('bad'); }
  });
  box.addEventListener('focus', ()=> box.select());
  box.addEventListener('blur', ()=>{
    const t = digitsToTime(box.value, isPm());
    if(t){ hidden.value = t; root.classList.remove('bad','shake'); paint(); return; }
    root.classList.add('bad','shake');
    if(navigator.vibrate) navigator.vibrate(18);
    setTimeout(()=>{
      paint();
      root.classList.remove('shake');
      root.classList.add('reverted');
      setTimeout(()=> root.classList.remove('bad','reverted'), 420);
    }, 330);
  });

  root.querySelectorAll('[data-ampm]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const t = to12(hidden.value);
      hidden.value = from12(t.h12, t.min, b.dataset.ampm==='pm');
      paint();
    });
  });
  root.querySelectorAll('[data-fmt]').forEach(b=>{
    b.addEventListener('click', ()=>{
      setTimeFmt(+b.dataset.fmt);
      document.querySelectorAll('.tf').forEach(el=>{
        el.classList.toggle('h12', TIME_FMT===12);
        el.classList.toggle('h24', TIME_FMT===24);
      });
      paint();
      renderScheduleScreen();       // 목록 표기도 함께 바꿔요
      renderCarousel();
    });
  });

  paint();
}

function renderGeoResults(items, st, rs){
  rs.innerHTML='';

      <span class="gr-txt"><b>${esc(it.title)}</b>${it.sub? `<span class="geo-sub">${esc(it.sub)}</span>`:''}</span>`;

async function pickResult(it, btn, st){
  document.querySelectorAll('.geo-result').forEach(x=>x.classList.remove('picked'));
  btn.classList.add('picked');

  if(it.placeId && ensurePlaces()){
    st.textContent='위치를 확인하는 중...';
    const detail = await new Promise(resolve=>{
      placesService.getDetails(
        { placeId: it.placeId, fields:['name','formatted_address','geometry'], sessionToken: acToken },
        (res, status)=> resolve(status===google.maps.places.PlacesServiceStatus.OK ? res : null)
      );
    });
    newToken();
    if(detail && detail.geometry){
      geoPicked = {
        lat: detail.geometry.location.lat(),
        lng: detail.geometry.location.lng(),
        label: detail.formatted_address ? `${detail.name}, ${detail.formatted_address}` : detail.name
      };
      fillNameIfEmpty(detail.name || it.title);
      st.textContent = `이 위치로 저장됩니다: ${detail.name || it.title}`;
      return;
    }
    st.textContent = '위치 정보를 가져오지 못했어요. 다른 결과를 선택하거나 지도에서 직접 찍어주세요.';
    return;
  }

  geoPicked = { lat:it.lat, lng:it.lng, label: it.sub? `${it.title}, ${it.sub}` : it.title };
  fillNameIfEmpty(it.title);
  st.textContent = `이 위치로 저장됩니다: ${it.title}`;
}

function fillNameIfEmpty(name){
  const el=document.getElementById('f_name');
  if(el && !el.value.trim() && name) el.value = name;
}

/* ---- 구글 자동완성 (실시간 제안) ---- */
function googleSuggest(q){
  return new Promise(resolve=>{
    if(!ensurePlaces()) return resolve({items:[], status:'NO_PLACES'});
    if(!acToken) newToken();
    acService.getPlacePredictions({
      input: q,
      sessionToken: acToken,
      language: 'ko',
      locationBias: new google.maps.Circle({ center:{lat:SAPPORO.lat, lng:SAPPORO.lng}, radius:150000 })
    }, (preds, status)=>{
      if(status!==google.maps.places.PlacesServiceStatus.OK || !preds){
        return resolve({ items:[], status });
      }
      resolve({
        items: preds.slice(0,7).map(p=>{
          const f=p.structured_formatting||{};
          const types=p.types||[];
          let icon='navMap';
          if(types.includes('restaurant')||types.includes('food')||types.includes('cafe')) icon='food';
          else if(types.includes('lodging')) icon='bed';
          else if(types.includes('transit_station')||types.includes('subway_station')) icon='metro';
          else if(types.includes('bus_station')) icon='bus';
          else if(types.includes('airport')) icon='plane';
          return { title: f.main_text || p.description, sub: f.secondary_text || '', placeId: p.place_id, icon };
        }),
        status:'OK'
      });
    });
  });
}

async function searchNominatim(q){
  const view='139.0,46.0,146.5,41.0';
  const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=7&accept-language=ko,ja,en&viewbox=${view}&q=${encodeURIComponent(q)}`);
  if(!res.ok) return [];
  const data=await res.json();
  return data.map(r=>{
    const parts=r.display_name.split(',').map(x=>x.trim());
    return { title:parts[0], sub:parts.slice(1,4).join(', '), lat:parseFloat(r.lat), lng:parseFloat(r.lon) };
  });
}
async function searchPhoton(q){
  const res=await fetch(`https://photon.komoot.io/api/?limit=7&lang=default&lat=${SAPPORO.lat}&lon=${SAPPORO.lng}&q=${encodeURIComponent(q)}`);
  if(!res.ok) return [];
  const data=await res.json();
  return (data.features||[]).map(f=>{
    const p=f.properties||{};
    return { title:p.name||p.street||'', sub:[p.street,p.district,p.city,p.state,p.country].filter(Boolean).join(', '),
             lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0] };
  }).filter(x=>x.title);
}

/* ---- 입력할 때마다 자동 검색 ---- */
function onGeoInput(){
  const q=document.getElementById('f_geoQuery').value.trim();
  const st=document.getElementById('f_geoStatus'), rs=document.getElementById('f_geoResults');
  clearTimeout(searchTimer);
  if(q.length<2){ rs.innerHTML=''; return; }
  const delay = ensurePlaces() ? 250 : 650;   // 무료 엔진은 호출 간격을 넉넉히
  st.textContent='검색 중...';
  searchTimer=setTimeout(()=> doGeoSearch(true), delay);
}

async function doGeoSearch(isLive){
  const q=document.getElementById('f_geoQuery').value.trim();
  const st=document.getElementById('f_geoStatus'), rs=document.getElementById('f_geoResults');
  if(!q){ st.textContent='검색어를 입력해주세요.'; return; }
  const seq = ++searchSeq;
  if(!isLive){ st.textContent='검색 중...'; rs.innerHTML=''; }

  try{
    if(ensurePlaces()){
      const g = await googleSuggest(q);
      if(seq!==searchSeq) return;
      if(g.status==='OK' && g.items.length){
        renderGeoResults(g.items, st, rs);
        st.textContent='원하는 곳을 선택하세요.';
        return;
      }
      if(g.status==='REQUEST_DENIED'){
        rs.innerHTML='';
        st.innerHTML='장소 검색이 거부됐어요(REQUEST_DENIED). Google Cloud Console에서 <b>Places API</b>가 사용 설정되어 있는지, 키의 API 제한사항에 포함되어 있는지 확인해주세요.';
        return;
      }
      if(g.status==='ZERO_RESULTS'){
        rs.innerHTML='';
        st.innerHTML='검색 결과가 없어요. 철자를 바꾸거나 <b>지도에서 직접 찍기</b>를 이용해보세요.';
        return;
      }
    }

    let list = await searchNominatim(q);
    if(seq!==searchSeq) return;
    if(renderGeoResults(list, st, rs)){ st.textContent='원하는 곳을 선택하세요.'; return; }

    list = await searchPhoton(q);
    if(seq!==searchSeq) return;
    if(renderGeoResults(list, st, rs)){ st.textContent='원하는 곳을 선택하세요.'; return; }

    rs.innerHTML='';
    st.innerHTML='검색 결과가 없어요. 가게 이름은 <b>일본어나 영어</b>로 넣으면 더 잘 찾아요 (예: 라마이 → <b>RAMAI 札幌</b>). <b>지도에서 직접 찍기</b>로 정할 수도 있어요.';
  }catch(e){
    if(seq!==searchSeq) return;
    st.innerHTML='검색 중 오류가 발생했어요. 잠시 후 다시 시도하거나 <b>지도에서 직접 찍기</b>를 이용해주세요.';
  }
}

let miniMap=null, miniMarker=null;
function toggleMiniMap(){
  const box=document.getElementById('f_miniMap');
  const st=document.getElementById('f_geoStatus');
  if(!box) return;
  const opening = box.style.display==='none' || !box.style.display;
  box.style.display = opening ? 'block' : 'none';
  if(!opening) return;

  const center = geoPicked ? [geoPicked.lat, geoPicked.lng] : [SAPPORO.lat, SAPPORO.lng];
  if(!miniMap){
    miniMap = L.map(box, { zoomControl:true, attributionControl:false }).setView(center, 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(miniMap);
    miniMap.on('click', async e=>{
      const {lat,lng}=e.latlng;
      if(miniMarker) miniMap.removeLayer(miniMarker);
      miniMarker = L.marker([lat,lng]).addTo(miniMap);
      geoPicked = { lat, lng, label:'지도에서 선택한 위치' };
      st.textContent = '이 위치로 저장됩니다. 주소를 확인하는 중...';
      try{
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&accept-language=ko,ja,en&lat=${lat}&lon=${lng}`);
        const d = await r.json();
        if(d && d.display_name){
          geoPicked.label = d.display_name;
          st.textContent = '이 위치로 저장됩니다: ' + shortPlace(d.display_name);
        } else { st.textContent = '이 위치로 저장됩니다.'; }
      }catch(err){ st.textContent = '이 위치로 저장됩니다.'; }
    });
  } else {
    miniMap.setView(center, 13);
  }
  setTimeout(()=>{ miniMap.invalidateSize(); }, 80);
}

function shortPlace(l){ return l? l.split(',').map(x=>x.trim()).slice(0,3).join(', '):''; }
function saveForm(){
  const name=document.getElementById('f_name').value.trim();
  const time=document.getElementById('f_time').value.trim();
  const cat=document.getElementById('f_cat').value;
  const note=document.getElementById('f_note').value.trim();
  if(!name||!time){ alert('이름과 시간은 꼭 입력해주세요.'); return; }
  const day=currentDay();
  const optSel = document.querySelector('#f_optWrap .seg.on');
  const isOpt = !!(optSel && optSel.dataset.opt==='1');
  if(editingStopId){
    const s=day.stops.find(x=>x.id===editingStopId);
    s.name=name; s.time=time; s.cat=cat; s.note=note;
    if(isOpt) s.opt=true; else delete s.opt;
    if(geoPicked){ s.lat=geoPicked.lat; s.lng=geoPicked.lng; s.place=shortPlace(geoPicked.label); s.tbd=false; }
  } else {
    const ns={id:newUid(),time,name,note,cat,mode:'walk'};
    if(isOpt) ns.opt=true;
    const ps=dayPlans(day);
    if(ps.length>1) ns.plan=activePlanId(day);   // 안이 여러 개일 때만 귀속
    if(geoPicked){ ns.lat=geoPicked.lat; ns.lng=geoPicked.lng; ns.place=shortPlace(geoPicked.label); ns.tbd=false; }
    else ns.tbd=true;
    day.stops.push(ns);
  }
  day.stops.sort((a,b)=>a.time.localeCompare(b.time));
  markChanged();
  editingStopId=null; geoPicked=null;
  getFormArea().innerHTML='';
  activeStopId=null; renderScheduleScreen();
  toast('저장했어요');
}
function deleteStop(id){
  if(!confirm('이 일정을 삭제할까요?')) return;
  const day=currentDay();
  const target=day.stops.find(x=>x.id===id);
  if(target && target.stay) day.noStay=true;   // 이 날은 숙소 출발을 자동으로 넣지 않음
  day.stops=day.stops.filter(x=>x.id!==id);
  markChanged();
  editingStopId=null;
  getFormArea().innerHTML='';
  renderScheduleScreen();
}

  return `<div class="bk-wrap">
      <div class="bk-title">이전 일정으로 되돌리기</div>
      <p class="hint" style="margin:0 0 10px;">일정이 바뀌기 직전 상태를 최근 8개까지 이 기기에 보관해요.</p>
      ${list.map((b,i)=>`
        <div class="bk-row">
          <span class="bk-meta"><b>${fmt(b.at)}</b> · 일정 ${b.count}개${b.why? ` · ${esc(b.why)}`:''}</span>
          <button type="button" class="bk-btn" data-bk="${i}">되돌리기</button>
        </div>`).join('')}
    </div>`;
}
function bindBackupButtons(){
  document.querySelectorAll('[data-bk]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!confirm('이 시점의 일정으로 되돌릴까요? 지금 내용은 백업에 남습니다.')) return;
      restoreBackup(Number(b.dataset.bk));
    });
  });
}

/* ================= AI ================= */
const aiModalBg=document.getElementById('aiModalBg');
document.getElementById('aiFab').addEventListener('click', openAiModal);
function openAiModal(){
  const day=currentDay(), panel=document.getElementById('aiPanel');
  document.getElementById('aiSub').textContent = day
    ? `${fmtDate(day.iso)} (${fmtDow(day.iso)}) · ${day.label} 일정을 참고해 근처 장소를 추천해요.`
    : '먼저 날짜를 추가해주세요.';

  const mode = aiMode();

  if(mode==='off'){
    panel.innerHTML=`<div class="disabled-box">
      <div class="dtitle">${DISABLED_MSG}</div>
      <div class="ddesc">AI 장소 추천을 사용하려면 관리자가 <code>config.js</code>의<br><code>AI_PROXY_URL</code>을 설정해야 합니다.</div></div>`;
  }
  else if(mode==='needkey'){
    panel.innerHTML=`<div class="disabled-box" style="text-align:left;">
        <div class="dtitle" style="text-align:center;">${DISABLED_MSG}</div>
        <div class="ddesc" style="text-align:center;">공용 AI 연결이 설정되어 있지 않아요.<br>대신 <b>내 OpenAI 키</b>로 사용할 수 있어요.</div>
      </div>
      <label class="field-lbl">내 OpenAI API Key</label>
      <input type="password" id="myKey" class="key-input" placeholder="sk-...">
      <p class="hint">이 키는 <b>이 기기에만</b> 저장되고 친구들에게 전달되지 않아요. 사용료는 키 주인에게 청구됩니다.</p>
      <button class="btn-primary" id="saveKeyBtn" style="margin-top:12px;">키 저장하고 사용하기</button>`;
    document.getElementById('saveKeyBtn').addEventListener('click', ()=>{
      const v=document.getElementById('myKey').value.trim();
      if(!v){ toast('키를 입력해주세요'); return; }
      try{ localStorage.setItem(LS_AIKEY, v); }catch(e){}
      document.getElementById('aiFab').classList.remove('off');
      openAiModal(); toast('키를 저장했어요');
    });
  }
  else {
    const badge = mode==='proxy'
      ? '공용 AI 연결을 사용 중이에요.'
      : '내 기기에 저장된 개인 키를 사용 중이에요.';
    const anchor = activeStopId ? (stopById(activeStopId)||{}).stop : null;
    const anchorOk = anchor && currentDay() && currentDay().stops.some(x=>x.id===anchor.id);
    panel.innerHTML=`
      <div class="ai-choice">
        <button class="btn-primary" id="aiRunDay">이 날 전체 추천</button>
        <button class="btn-primary ${anchorOk?'':'disabled'}" id="aiRunNext" ${anchorOk?'':'disabled'}>다음 코스 추천</button>
      </div>
      <p class="hint">${anchorOk
        ? `<b>${esc(anchor.name)}</b> 다음에 들를 만한 곳을 찾아줘요.`
        : '지도 탭에서 장소를 고르면 그 다음 코스를 추천받을 수 있어요.'}</p>
      <div class="ai-status" id="aiStatus">${badge}</div>
      <div id="aiResults"></div>
      ${mode==='personal'? '<button class="link-btn" id="clearKeyBtn">저장된 내 키 삭제</button>':''}`;
    document.getElementById('aiRunDay').addEventListener('click', ()=> runAiRecommend('day'));
    const nextBtn = document.getElementById('aiRunNext');
    if(anchorOk) nextBtn.addEventListener('click', ()=> runAiRecommend('next'));
    const ck=document.getElementById('clearKeyBtn');
    if(ck) ck.addEventListener('click', ()=>{
      try{ localStorage.removeItem(LS_AIKEY); }catch(e){}
      document.getElementById('aiFab').classList.add('off');
      openAiModal(); toast('저장된 키를 삭제했어요');
    });
  }
  aiModalBg.classList.add('open');
}

function buildAiPayload(day, kind){
  const payload = {
    city: '삿포로',
    date: `${fmtDate(day.iso)} (${fmtDow(day.iso)})`,
    theme: day.label||'',
    stops: day.stops.map(s=>({ time:s.time, name:s.name, cat:s.cat, note:s.note||'' }))
  };
  if(kind==='next'){
    const i = day.stops.findIndex(x=>x.id===activeStopId);
    const cur  = day.stops[i];
    const next = day.stops[i+1];
    if(cur){
      payload.focus = {
        after: cur.name,
        afterTime: cur.time,
        before: next? next.name : null,
        beforeTime: next? next.time : null
      };
    }
  }
  return payload;
}

function buildAiPrompt(day, kind){
  const text = day.stops.map(s=>`${s.time} ${s.name} (${s.cat})${s.note? ' - '+s.note:''}`).join('\n');
  const head = `오늘(${fmtDate(day.iso)} ${fmtDow(day.iso)}, 테마: ${day.label}) 일정입니다.\n${text}\n\n`;
  if(kind==='next'){
    const i = day.stops.findIndex(x=>x.id===activeStopId);
    const cur=day.stops[i], next=day.stops[i+1];
    if(cur && next) return head + `"${cur.name}"(${cur.time})을 마치고 "${next.name}"(${next.time})로 가기 전에 들를 만한 곳을 추천해줘. 두 장소 사이 동선에서 크게 벗어나지 않고, 남는 시간에 맞는 곳으로.`;
    if(cur) return head + `"${cur.name}"(${cur.time}) 다음에 이어서 갈 만한 곳을 추천해줘. 도보나 짧은 대중교통으로 갈 수 있는 거리로.`;
  }
  return head + `이 동선에 자연스럽게 어울리는 장소를 추천해줘.`;
}

async function runAiRecommend(kind){
  kind = kind || 'day';
  const st=document.getElementById('aiStatus'), rs=document.getElementById('aiResults');
  const day=currentDay();
  if(!day){ st.textContent='날짜가 없어요.'; return; }
  rs.innerHTML=''; st.textContent='추천을 불러오는 중입니다.'; st.className='ai-status';

  try{
    let list;
    if(aiMode()==='proxy'){
      const res=await fetch(CFG.AI_PROXY_URL,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(buildAiPayload(day, kind))
      });
      if(res.status===429){ st.textContent='요청이 너무 많아요. 잠시 후 다시 시도해주세요.'; st.className='ai-status ai-error'; return; }
      if(!res.ok){ st.textContent=`요청이 실패했어요 (${res.status}). 관리자에게 프록시 주소 확인을 요청해주세요.`; st.className='ai-status ai-error'; return; }
      const data=await res.json();
      list = Array.isArray(data) ? data : (data.items||data.places||[]);
    } else {
      const res=await fetch('https://api.openai.com/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+personalKey()},
        body:JSON.stringify({ model:CFG.OPENAI_MODEL, temperature:0.7, messages:[
          {role:'system', content:'너는 삿포로 현지 여행 코디네이터야. 사용자가 준 하루 일정을 참고해서, 동선상 어울리는 장소(카페, 포토스팟, 소품샵, 작은 명소 등) 3에서 5곳을 추천해. 반드시 JSON 배열만 출력하고 다른 텍스트는 쓰지마. 형식: [{"name":"장소명","category":"관광|식사|휴식|선택 중 하나","reason":"추천 이유, 한국어 1에서 2문장"}]'},
          {role:'user', content: buildAiPrompt(day, kind)}
        ]})
      });
      if(res.status===401){ st.textContent='키가 올바르지 않아요. 저장된 키를 삭제하고 다시 입력해주세요.'; st.className='ai-status ai-error'; return; }
      if(!res.ok){ st.textContent=`요청이 실패했어요 (${res.status}). 키와 모델명(${esc(CFG.OPENAI_MODEL)})을 확인해주세요.`; st.className='ai-status ai-error'; return; }
      const data=await res.json();
      let content=(data.choices&&data.choices[0]&&data.choices[0].message? data.choices[0].message.content:'').replace(/```json|```/g,'').trim();
      try{ list=JSON.parse(content); }
      catch(e){ st.textContent='응답을 해석하지 못했어요. 모델이 JSON 형식을 지키지 않았을 수 있어요.'; st.className='ai-status ai-error'; return; }
    }

    if(!list || !list.length){ st.textContent='추천 결과가 비어있어요.'; st.className='ai-status ai-error'; return; }
    st.textContent=`${list.length}곳을 추천받았어요.`;
    list.forEach(item=>{
      const c=document.createElement('div'); c.className='sugg-card';
      c.innerHTML=`<div class="name">${esc(item.name)}</div><div class="cat">${esc(item.category||'')}</div>
        <div class="reason">${esc(item.reason||'')}</div><button class="sugg-add">일정표에 추가하기</button>`;
      c.querySelector('.sugg-add').addEventListener('click', ()=> addSuggestion(item));
      rs.appendChild(c);
    });
  }catch(e){
    st.textContent='네트워크 오류가 발생했어요. 잠시 후 다시 시도해주세요.';
    st.className='ai-status ai-error';
  }
}
function addSuggestion(item){
  aiModalBg.classList.remove('open');
  switchScreen('schedule'); openForm(null);
  document.getElementById('f_name').value=item.name;
  document.getElementById('f_note').value=item.reason||'';
  document.getElementById('f_cat').value = Object.keys(CATS).includes(item.category)? item.category:'관광';
  document.getElementById('f_geoQuery').value=item.name+' 삿포로';
}

/* 예상치 못한 오류를 조용히 넘기지 않도록 */
window.addEventListener('error', (e)=>{
  console.error('[오류]', e.message);
  if(typeof toast==='function') toast('오류가 발생했어요: '+String(e.message).slice(0,60));

/* ================= INIT ================= */
async function init(){
  mountIcons();
  document.getElementById('aiFabIcon').innerHTML=iconSvg('star');
  initLeaflet();
  loadPrep();

  // 1) 공유 링크로 들어온 경우
  const m = location.hash.match(/#trip=(.+)$/);
  if(m){
    const shared = decodeTrip(m[1]);
    if(shared && shared.days){
      TRIP = shared; writeLocal();
      history.replaceState(null,'',location.pathname);
      setTimeout(()=> toast('공유받은 일정을 불러왔어요'), 400);
    }
  } else {
    const local = readLocal();
    if(local && local.days) TRIP = local;
  }

  // 예전 버전 데이터 호환: 지하철/버스 → 대중교통
  TRIP.days.forEach(d=> d.stops.forEach(st=>{ if(st.mode) st.mode = normalizeMode(st.mode); }));
  sortDays();
  activeDayId = TRIP.days.length? TRIP.days[0].id : null;
  setSyncLabel(HAS_SYNC? '동기화 중...' : '내 기기 저장');

  if(HAS_GMAP) bootGoogleMaps();
  if(!aiUsable()) document.getElementById('aiFab').classList.add('off');

  refreshAll();
  switchScreen('map');

  // 2) 서버 내용을 먼저 받아온 뒤에 자동 보정을 적용합니다
  //    (순서가 바뀌면 오래된 내 사본이 서버를 덮어써서 일정이 사라질 수 있어요)
  if(HAS_SYNC){
    await pullRemote(true);
    syncReady = true;
    syncTimer = setInterval(()=> pullRemote(false), 15000);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pullRemote(false); });
  }

  pushBackup(TRIP, '앱 시작');
  const fixed = ensureFlightStops() | ensureStayStarts();
  if(fixed){ refreshAll(); }
  if(HAS_SYNC && !TRIP.updatedAt) markChanged();

  // 3) 앱처럼 쓰기 위한 서비스워커
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
init();
</script>
