<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#E03B4B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="삿포로" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<title>삿포로 여행 일정</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF; --ink:#1C1C1E; --muted:#8A8A8E; --muted-2:#C4C4C8;
    --line:#EDEDF0; --line-2:#DFDFE4; --tint:#F2F2F7;   /* iOS systemGroupedBackground 계열 */
    --fill:#EFEFF4;                                      /* 눌리는 면 */
    --red:#D92C44; --red-soft:#FCEDEF;

    /* 카테고리 색 — 일정의 성격을 색으로 구분합니다 */
    --c-move:#3D6FD6;  --c-move-s:#EAF0FD;   /* 이동 · 하늘길 */
    --c-food:#DD6B3E;  --c-food-s:#FDF0E9;   /* 식사 · 따뜻함 */
    --c-sight:#1F8C63; --c-sight-s:#E7F5EF;  /* 관광 · 홋카이도의 초록 */
    --c-stay:#6B5CC4;  --c-stay-s:#EFEDFB;   /* 숙소 · 저녁 */
    --c-rest:#B5841F;  --c-rest-s:#FBF3E2;   /* 휴식 · 차 한 잔 */
    --c-pick:#8A8A8E;  --c-pick-s:#F1F1F4;   /* 선택 · 미정 */
    --shadow-card:0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.06);
    --shadow-float:0 2px 6px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.12);
    --font-body:-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro KR', sans-serif;
    --font-mono:'SF Mono', ui-monospace, 'IBM Plex Mono', monospace;
    --r-sheet:16px;   /* 시트 */
    --r-card:12px;    /* 카드·리스트 */
    --r-ctl:9px;      /* 버튼·입력 */
    --r-lg:16px; --r-md:12px; --r-sm:9px;
    --ease:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button, .trow, .place-card, .prep-item, .geo-result{ touch-action:manipulation; }
  html,body{margin:0;padding:0;height:100%;}
  body{ background:#DCDCE0; color:var(--ink); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; overscroll-behavior:none; }
  button{ font-family:inherit; letter-spacing:-.01em;
    transition:opacity .18s var(--ease), background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease); }
  button:active{ opacity:.55; }
  .navbtn:active, .modal-close:active{ transform:none; }

  /* 화면 전환 */
  .screen.active{ animation:screenIn .22s ease; }
  @keyframes screenIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  /* 목록 항목 진입 */
  .trow{ animation:rowIn .2s ease both; }
  @keyframes rowIn{ from{ opacity:0; transform:translateY(-3px); } to{ opacity:1; transform:none; } }

  /* 스크롤 관성 */
  .screen, .carousel, .geo-results, .modal{ -webkit-overflow-scrolling:touch; }

  /* 지도 핀 */
  .pin-wrap{ transition:transform .18s ease; }
  .app{ max-width:520px; margin:0 auto; height:100vh; height:100dvh;
    background:var(--paper); display:flex; flex-direction:column;
    position:relative; overflow:hidden; box-shadow:0 0 48px rgba(0,0,0,.18); }
  .icon{ display:inline-flex; width:17px; height:17px; }
  .icon svg{ width:100%; height:100%; }
  .screen{ flex:1; min-height:0; display:none; flex-direction:column; position:relative; }
  .screen.active{ display:flex; }

  /* ===== MAP ===== */
  #screen-map{ overflow:hidden; background:#E9E9ED; }
  #map, #gmap{ position:absolute; inset:0; }
  #gmap{ display:none; }
  .leaflet-tile-pane{ filter:grayscale(78%) contrast(1.05) brightness(1.05); }
  .leaflet-control-attribution{ display:none; }

  .float-head{ position:absolute; top:0; left:0; right:0; z-index:500;
    padding:12px 12px 0; display:flex; flex-direction:column; gap:14px; pointer-events:none; }
  .float-head > *{ pointer-events:auto; }

  .topbar{ background:rgba(255,255,255,.86); backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px); border-radius:14px; padding:12px 14px;
    display:flex; align-items:center; gap:11px; box-shadow:var(--shadow-card); }
  .topbar .mark{ width:32px;height:32px;flex:0 0 32px;border-radius:11px;background:var(--red-soft);
    display:flex;align-items:center;justify-content:center;color:var(--red); }
  .topbar .mark .icon{ width:17px;height:17px; }
  .topbar .tt{ min-width:0; flex:1; }
  .topbar h1{ font-size:16px; font-weight:600; margin:0; letter-spacing:-.025em; line-height:1.25; }
  .topbar .tsub{ font-size:11px; color:var(--muted-2); font-family:var(--font-mono); margin-top:2px;
    display:flex; align-items:center; gap:5px; }
  .topbar .tsub i{ width:5px;height:5px;border-radius:50%;background:var(--muted-2);display:block; }
  .topbar .tsub.sync i{ background:#35C27A; }
  .head-btn{ flex:0 0 auto; width:32px;height:32px; border:none; background:var(--fill);
    border-radius:8px; color:var(--muted); cursor:pointer; display:flex;align-items:center;justify-content:center; }
  .head-btn .icon{ width:16px;height:16px; }
  .head-btn.on{ background:var(--red-soft); color:var(--red); }

  .daybar{ display:flex; gap:7px; overflow-x:auto; padding:2px 1px 4px;
    -ms-overflow-style:none; scrollbar-width:none; }
  .daybar::-webkit-scrollbar{ display:none; }
  .daychip{ flex:0 0 auto; min-width:96px; background:var(--fill); color:var(--muted); border:none;
    border-radius:10px; padding:9px 13px; cursor:pointer; text-align:left;
    transition:background .22s var(--ease), color .22s var(--ease); }
  .daychip .d{ display:block; font-size:11px; font-weight:500; opacity:.8; margin-bottom:1px;
    font-variant-numeric:tabular-nums; }
  .daychip .l{ display:block; font-size:13.5px; font-weight:600; letter-spacing:-.02em; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:130px; }
  .daychip.active{ background:var(--ink); color:#fff; }
  .daychip.active .l{ color:#fff; }
  .daychip.active .d{ opacity:.65; }

  .bottom-stack{ position:absolute; left:0; right:0; bottom:0; z-index:500;
    display:flex; flex-direction:column; gap:9px; padding-bottom:12px; pointer-events:none; }
  .bottom-stack > *{ pointer-events:auto; }
  .bottom-row{ display:flex; align-items:center; gap:8px; padding:0 12px; justify-content:space-between; }
  .ai-fab{ flex:0 0 auto; white-space:nowrap;
    background:rgba(255,255,255,.84); backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    color:var(--ink); border:none; border-radius:10px;
    padding:10px 15px; font-size:13px; font-weight:500; letter-spacing:-.01em;
    display:flex; align-items:center; gap:7px; box-shadow:var(--shadow-card); }
  .ai-fab .icon{ color:var(--red); }
  .ai-fab .icon{ color:#FFD24C; width:14px; height:14px; }
  .ai-fab.off{ background:#fff; color:var(--muted-2); }
  .ai-fab.off .icon{ color:var(--muted-2); }

  .carousel{ display:flex; gap:9px; overflow-x:auto; scroll-snap-type:x mandatory;
    padding:6px 0 2px; -ms-overflow-style:none; scrollbar-width:none; }
  .carousel::-webkit-scrollbar{ display:none; }
  .carousel::before, .carousel::after{ content:''; flex:0 0 var(--edge); }
  .place-card{ scroll-snap-align:center; scroll-snap-stop:always; flex:0 0 var(--cardw);
    background:#fff; border-radius:14px; padding:15px 16px 16px; cursor:pointer;
    box-shadow:var(--shadow-float); border:1.5px solid transparent;
    transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease; }
  .place-card.active{ transform:translateY(-2px); }
  .place-card.active{ border-color:var(--red); }
  .place-card.empty{ text-align:center; color:var(--muted); font-size:13px; padding:22px 16px; }
  .pc-top{ display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .pc-num{ width:24px;height:24px; border-radius:8px; color:#fff;
    font-size:12px; font-weight:600; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; flex:0 0 24px; letter-spacing:-.02em; }
  .pc-time{ font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .pc-chip{ margin-left:auto; display:flex;align-items:center;gap:5px;
    border-radius:7px; padding:4px 9px; font-size:11.5px; font-weight:500; }
  .pc-chip .icon{ width:12px;height:12px; }
  .pc-name{ font-size:17px; font-weight:600; margin:0 0 6px; line-height:1.3; letter-spacing:-.03em; }
  .pc-note{ font-size:13px; color:var(--muted); line-height:1.45; letter-spacing:-.01em; }
  .pc-foot{ display:flex; align-items:center; gap:8px; margin-top:9px; }
  .pc-rating{ font-size:12px; }
  .pc-rating .star{ color:#FFB020; }
  .pc-rating .rc{ color:var(--muted-2); }
  .tbd-badge{ font-size:10.5px; color:var(--muted); background:var(--tint); border-radius:999px; padding:3px 9px; }

  /* ===== SCHEDULE ===== */
  #screen-schedule{ overflow-y:auto; background:#F5F5F8; }
  .sec-header{ padding:18px 16px 13px; background:rgba(255,255,255,.94);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    position:sticky; top:0; z-index:10; border-bottom:.5px solid rgba(0,0,0,.08); }
  .sec-title-row{ display:flex; align-items:center; gap:8px; margin-bottom:13px; }
  .sec-header h1{ font-size:26px; font-weight:700; margin:0; letter-spacing:-.03em; flex:1; min-width:0; }
  .mini-btn{ flex:0 0 auto; border:none; background:var(--fill); color:var(--ink);
    border-radius:var(--r-ctl); padding:9px 14px; font-size:13px; font-weight:500; cursor:pointer;
    display:flex; align-items:center; gap:6px; letter-spacing:-.01em; }
  .mini-btn .icon{ width:13px;height:13px; }
  .stay-row{ display:flex; align-items:center; gap:10px; width:100%; margin:0 0 7px;
    background:#fff; border:none; border-radius:var(--r-card);
    padding:13px 14px; cursor:pointer; text-align:left; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .stay-row:active{ background:var(--fill); }
  .stay-row .icon{ width:15px; height:15px; color:var(--muted-2); flex:0 0 15px; }
  .stay-row.set .icon{ color:var(--red); }
  .stay-txt{ flex:1; min-width:0; font-size:14.5px; font-weight:500; color:var(--muted);
    letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stay-row.set .stay-txt{ color:var(--ink); }
  .stay-edit{ flex:0 0 auto; font-size:12.5px; font-weight:400; color:#C7C7CC; }
  .stay-txt b{ font-weight:700; color:var(--red); margin-right:4px; }
  .stay-inherit{ font-size:10px; font-weight:600; color:var(--muted-2);
    border:1px solid var(--line-2); border-radius:999px; padding:1px 6px; margin-left:4px; }
  .stay-tag{ background:var(--red-soft) !important; color:var(--red) !important; }
  .opt-tag{ background:#FFF4E0 !important; color:#B4720A !important; }
  .flight-tag{ background:#E9F0FF !important; color:#2F6BD8 !important; }

  /* 선택 일정 */
  .stop.optional{ border:1px dashed var(--line-2); box-shadow:none; background:#FFFDF8; }
  .stop .num.opt{ background:#E8A33D; }

  /* 확정/선택 토글 */
  /* iOS 세그먼티드 컨트롤 */
  .seg-toggle{ display:flex; gap:2px; background:var(--fill); border-radius:9px; padding:2px; }
  .seg-toggle .seg{ flex:1; border:none; background:transparent; color:var(--ink);
    padding:8px 0; font-size:13.5px; font-weight:500; cursor:pointer; border-radius:7px;
    transition:background .22s var(--ease), box-shadow .22s var(--ease), font-weight .1s; }
  .seg-toggle .seg.on{ background:#fff; font-weight:600;
    box-shadow:0 1px 3px rgba(0,0,0,.09), 0 1px 1px rgba(0,0,0,.04); }
  .seg-toggle .seg:active{ opacity:1; transform:scale(.96); }

  /* 카테고리 고르기 */
  .cat-pick{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .cat-opt{ display:flex; align-items:center; justify-content:center; gap:5px;
    border:none; background:var(--fill); color:var(--muted); border-radius:9px;
    padding:11px 4px; font-size:13px; font-weight:500; cursor:pointer; letter-spacing:-.02em;
    transition:background .2s var(--ease), color .2s var(--ease); }
  .cat-opt .icon{ width:14px; height:14px; }
  .cat-opt.on{ background:var(--cs); color:var(--cc); font-weight:600; }

  /* 하루 요약 */
  .day-summary{ display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .ds-left{ display:flex; align-items:center; gap:7px; flex:1; min-width:0; flex-wrap:wrap; }
  .ds-chip{ font-size:12px; font-weight:500; border-radius:999px; padding:4px 10px; }
  .ds-chip.fix{ background:var(--c-sight-s); color:var(--c-sight); }
  .ds-chip.opt{ background:var(--c-pick-s); color:var(--c-pick); }
  .ds-move{ font-size:11.5px; color:var(--muted); font-weight:600; }
  .ds-sub{ font-size:11px; color:var(--muted-2); }
  .ds-toggle{ flex:0 0 auto; border:none; background:var(--fill); color:var(--ink);
    border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:500; cursor:pointer;
    letter-spacing:-.01em; }
  .ds-toggle.off{ background:var(--ink); color:#fff; }

  /* 구간 사이 추가 버튼 */
  .leg .rail{ flex-direction:column; align-items:center; }
  .leg .rail span{ flex:1; }
  .leg-add{ width:22px; height:22px; flex:0 0 22px; border-radius:50%; border:1px dashed var(--line-2);
    background:#fff; color:var(--muted); font-size:14px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; margin:4px 0; padding:0; }
  .leg-add:hover{ border-color:var(--ink); color:var(--ink); border-style:solid; }

  /* 항공편 폼 */
  .fl-sec{ font-size:12px; font-weight:700; color:var(--red); margin-bottom:10px;
    padding-bottom:7px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; }
  .fl-use{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--muted); font-weight:600; }
  .fl-use input{ width:15px; height:15px; accent-color:var(--red); margin:0; }

  /* 시간 입력 */
  .tf{ position:relative; }
  .tf-box{ position:relative; }
  .tf-input{ width:100%; padding:13px !important; border-radius:var(--r-sm) !important;
    border:1px solid var(--line-2) !important; background:var(--tint) !important;
    font-family:var(--font-mono) !important; font-size:20px !important; font-weight:600;
    letter-spacing:.06em; text-align:center; }
  .tf-ctrl{ display:flex; gap:8px; margin-top:9px; }
  .tf-seg{ display:flex; gap:2px; background:var(--fill); border-radius:9px; padding:2px; }
  .tf-seg button{ border:none; background:transparent; color:var(--ink);
    padding:7px 14px; font-size:12.5px; font-weight:500; cursor:pointer; border-radius:7px;
    transition:background .22s var(--ease), box-shadow .22s var(--ease); }
  .tf-seg button.on{ background:#fff; font-weight:600;
    box-shadow:0 1px 3px rgba(0,0,0,.09), 0 1px 1px rgba(0,0,0,.04); }
  .tf-seg button:active{ opacity:1; }
  .tf-ampm{ flex:1; }
  .tf-ampm button{ flex:1; }
  .tf-fmt{ flex:0 0 auto; }
  .tf-fmt button{ font-family:var(--font-mono); font-size:11.5px; }
  .tf.h24 .tf-ampm{ display:none; }
  .tf.bad .tf-input{ border-color:var(--red) !important; color:var(--red); background:#FFF6F7 !important; }
  .tf.shake .tf-input{ animation:tfShake .32s cubic-bezier(.36,.07,.19,.97) both; }
  .tf.reverted .tf-input{ animation:tfPop .38s ease; }
  @keyframes tfShake{
    10%,90%{ transform:translateX(-2px); }
    20%,80%{ transform:translateX(4px); }
    30%,50%,70%{ transform:translateX(-7px); }
    40%,60%{ transform:translateX(7px); }
  }
  @keyframes tfPop{
    0%{ transform:scale(.97); opacity:.55; }
    55%{ transform:scale(1.015); opacity:1; }
    100%{ transform:scale(1); }
  }
  .tf-hint{ position:absolute; right:13px; top:50%; transform:translateY(-50%);
    font-size:10.5px; color:var(--muted-2); pointer-events:none; }
  /* 접이식 여행 설정 */
  .mini-btn.ghost{ background:var(--fill); border-color:transparent; color:var(--muted); }
  .mini-btn.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .trip-set{ margin-bottom:12px; }
  .set-actions{ display:flex; gap:7px; }
  .set-actions .mini-btn{ flex:1; justify-content:center; }

  /* 안(案) 선택 */
  .plan-bar{ display:flex; gap:6px; align-items:center; overflow-x:auto; scrollbar-width:none; }
  .plan-bar::-webkit-scrollbar{ display:none; }
  .plan-chip{ flex:0 0 auto; display:inline-flex; align-items:center;
    background:var(--fill); color:var(--muted); border-radius:8px;
    transition:background .22s var(--ease), color .22s var(--ease); overflow:hidden; }
  .plan-chip.on{ background:var(--red-soft); color:var(--red); }
  .plan-pick{ border:none; background:none; color:inherit; cursor:pointer;
    padding:8px 13px; font-size:13.5px; font-weight:500; letter-spacing:-.01em;
    display:flex; align-items:center; gap:6px; }
  .plan-chip.on .plan-pick{ font-weight:600; }
  .plan-x{ border:none; background:none; color:inherit; cursor:pointer; opacity:.5;
    padding:8px 11px 8px 2px; font-size:15px; line-height:1; }
  .plan-x:active{ opacity:.25; }
  .plan-n{ font-family:var(--font-mono); font-size:10.5px; opacity:.7; }
  .plan-add{ flex:0 0 32px; width:32px; height:32px; border-radius:8px;
    border:none; background:var(--fill); color:var(--muted);
    font-size:16px; line-height:1; cursor:pointer; padding:0; }

  /* 하단 날짜 도크 */
  .day-dock{ flex:0 0 auto; background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid rgba(0,0,0,.08); padding:9px 14px; }
  .day-dock[hidden]{ display:none; }
  .sched-days{ display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; }
  .sched-days::-webkit-scrollbar{ display:none; }
  .sched-days .daychip{ box-shadow:none; }
  .list-body{ padding:14px 16px 40px; }
  .empty-note.err{ color:var(--red); }
  .err-code{ display:inline-block; margin:8px 0; font-family:var(--font-mono); font-size:11px;
    background:var(--red-soft); border-radius:6px; padding:4px 8px; word-break:break-all; }
  .empty-note{ background:#fff; border-radius:var(--r-md); padding:26px 18px; text-align:center;
    color:var(--muted); font-size:13px; line-height:1.7; box-shadow:0 2px 10px rgba(26,26,30,.05); }

  /* ===== 표 형식 일정 ===== */
  .tbl{ background:#fff; border-radius:var(--r-card); overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .trow{ display:flex; align-items:center; gap:11px; padding:13px 14px; cursor:pointer; position:relative; }
  .trow::after{ content:''; position:absolute; left:47px; right:0; bottom:0; height:1px; background:var(--line); }
  .trow:last-child::after{ display:none; }
  .trow:active{ background:var(--fill); }
  .trow.open{ background:var(--tint); }
  .trow.optional{ background:#FCFCFD; }
  .trow.optional .tc-name{ color:var(--muted); }
  .tc-num{ flex:0 0 22px; height:22px; border-radius:7px; color:#fff;
    font-size:11px; font-weight:600; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; letter-spacing:-.02em; }
  .trow.optional .tc-num{ opacity:.45; }
  .tc-time{ flex:0 0 auto; min-width:44px; font-size:13.5px; font-weight:600; color:var(--muted);
    font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .tc-main{ flex:1; min-width:0; }
  .tc-name{ font-size:15px; font-weight:500; letter-spacing:-.02em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tc-sub{ font-size:12.5px; color:var(--muted); margin-top:2px;

  .tc-caret{ flex:0 0 auto; color:#C7C7CC; font-size:17px; font-weight:600;

  /* 이동 줄 */
  .tmove{ display:flex; align-items:center; gap:9px; padding:7px 14px; background:#FBFBFD;
    flex-wrap:wrap; position:relative; }
  .tmove::after{ content:''; position:absolute; left:47px; right:0; bottom:0; height:1px; background:var(--line); }
  .tm-add{ flex:0 0 22px; width:22px; height:22px; border-radius:50%; border:none;
    background:#fff; color:var(--red); font-size:15px; font-weight:400; line-height:1; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .tm-open{ flex:1; min-width:0; display:flex; align-items:center; gap:7px; border:none;
    background:none; padding:5px 0; cursor:pointer; color:var(--muted); font-size:12.5px; font-weight:500;
    letter-spacing:-.01em; }
  .tm-open .icon{ width:13px; height:13px; }
  .tm-label{ flex:1; min-width:0; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tm-fare{ font-family:var(--font-mono); color:var(--ink); font-weight:600; }
  .tm-caret{ flex:0 0 auto; }

  .tm-detail{ width:100%; border-top:1px solid var(--line); margin-top:4px; }

  .stop{ display:flex; gap:12px; background:#fff; border-radius:var(--r-md); padding:14px; box-shadow:0 2px 10px rgba(26,26,30,.05); }

    display:flex; align-items:center; justify-content:center; margin-top:2px; }
  .stop .num.tbd{ background:var(--muted-2); }

  .stop .time{ font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--red); }
  .stop .name{ font-size:15px; font-weight:700; margin:3px 0; letter-spacing:-.015em; }
  .stop .note{ font-size:12.5px; color:var(--muted); line-height:1.5; }
  .stop .loc{ display:flex; align-items:flex-start; gap:5px; font-size:11.5px; color:var(--muted-2); margin-top:6px; line-height:1.45; }
  .stop .loc .icon{ width:12px;height:12px; flex:0 0 12px; margin-top:1px; }
  .stop .row2{ display:flex; align-items:center; gap:9px; margin-top:9px; }
  .stop .tag{ font-size:10.5px; color:var(--muted); background:var(--tint); border-radius:999px; padding:3px 9px; font-weight:600; }
  .stop .edit-btn{ border:none; background:none; color:var(--ink); font-size:11.5px; font-weight:700; cursor:pointer; padding:0; margin-left:auto; }

  .leg{ display:flex; gap:12px; padding:4px 0; }

  .leg .rail span{ width:2px; background:var(--line-2); border-radius:2px; min-height:16px; }
  .leg .legbody{ flex:1; padding:8px 0 8px 2px; }
  .leg .modes{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .leg .modes::-webkit-scrollbar{ display:none; }
  .mode{ flex:0 0 auto; display:flex; align-items:center; gap:6px;
    border:none; background:var(--fill); color:var(--muted);
    border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:500; cursor:pointer;
    letter-spacing:-.01em; transition:background .22s var(--ease), color .22s var(--ease); }
  .mode .icon{ width:13px;height:13px; }
  .mode .mins{ font-family:var(--font-mono); font-size:11px; }
  .mode.active{ background:var(--ms); color:var(--mc); font-weight:600; }
  .leg .legmeta{ font-size:11px; color:var(--muted-2); margin-top:6px; line-height:1.5; }
  .leg .legmeta .off{ color:var(--red); font-weight:600; }

  /* 경로 상세 (노선 · 출발시각 · 요금) */
  .route-detail{ margin-top:9px; }
  .route-detail:empty{ display:none; }
  .rd-head{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-size:12px; }
  .rd-time{ font-family:var(--font-mono); font-weight:600; color:var(--ink); }
  .rd-fare{ font-family:var(--font-mono); font-weight:600; color:var(--ink);
    background:var(--tint); border-radius:999px; padding:2px 9px; }
  .rd-board{ font-size:11.5px; color:var(--red); font-weight:600; }
  .rd-eta{ font-size:10.5px; font-weight:700; color:var(--muted); background:var(--tint);
    border-radius:999px; padding:2px 8px; margin-left:5px; }
  .rd-eta.soon{ color:var(--red); background:var(--red-soft); }
  .rd-dur{ font-family:var(--font-mono); font-weight:600; color:var(--ink); }
  .rd-dist{ font-family:var(--font-mono); color:var(--muted); }
  .rd-fare.muted{ color:var(--muted-2); background:transparent; padding:0; font-family:inherit; font-weight:500; }
  .rd-sep{ color:var(--muted-2); }
  .rd-none{ font-size:12px; color:var(--muted); background:var(--tint); border-radius:var(--r-sm);
    padding:10px 12px; line-height:1.55; }
  .rd-none.err{ color:var(--red); background:var(--red-soft); }
  .rd-none b{ font-weight:700; }
  .err-hint{ color:var(--red) !important; }
  .bk-wrap{ margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
  .bk-title{ font-size:14px; font-weight:700; margin-bottom:6px; }
  .bk-row{ display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); }
  .bk-row:last-child{ border-bottom:none; }
  .bk-meta{ flex:1; min-width:0; font-size:12px; color:var(--muted); }
  .bk-meta b{ color:var(--ink); font-family:var(--font-mono); }
  .bk-btn{ flex:0 0 auto; border:1px solid var(--line-2); background:#fff; color:var(--ink);
    border-radius:999px; padding:6px 12px; font-size:11.5px; font-weight:700; cursor:pointer; }
  .rd-seg.line{ color:#fff; border-color:transparent; background:var(--red); }

  /* 단계별 안내 */
  .rd-steps{ list-style:none; margin:10px 0 0; padding:0 0 0 2px; border-left:2px solid var(--line);
    display:flex; flex-direction:column; gap:10px; }
  .rs{ padding-left:12px; position:relative; }
  .rs-line{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-size:13px; }
  .rs-line b{ font-weight:700; }
  .rd-dot-color{ width:9px;height:9px;border-radius:50%; display:inline-block; }
  .rs-kind{ font-size:10.5px; color:var(--muted); background:var(--tint); border-radius:999px; padding:2px 7px; }
  .rs-head{ font-size:11px; color:var(--muted); }
  .rs-body{ font-size:12px; color:var(--muted); margin-top:3px; line-height:1.5;
    display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .rs-body .icon{ width:12px;height:12px; }
  .rs-arrow{ color:var(--muted-2); }
  .rs-time{ font-family:var(--font-mono); font-size:11.5px; color:var(--red); font-weight:600; margin-top:3px; }
  .rs.walk .rs-body{ color:var(--muted-2); }

  /* 지도 범례 */
  .map-legend{ flex:0 1 auto; min-width:0; overflow-x:auto; scrollbar-width:none;
    background:rgba(255,255,255,.84); backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-radius:10px; padding:8px 12px; display:flex; gap:12px;
    box-shadow:var(--shadow-card); font-size:11px; font-weight:500; color:var(--muted); }
  .map-legend::-webkit-scrollbar{ display:none; }
  .map-legend span{ display:flex; align-items:center; gap:5px; flex:0 0 auto; }
  .lg-line{ width:14px; height:3px; border-radius:2px; display:block; }
  .lg-line.walk{ background:repeating-linear-gradient(90deg,#6E7781 0 3px,transparent 3px 6px); }
  .lg-line.transit{ background:#1F8C63; }
  .lg-line.drive{ background:#3D6FD6; }
  .lg-line.ai{ background:repeating-linear-gradient(90deg,#7C4DFF 0 5px,transparent 5px 8px); }
  .lg-line.osm{ background:linear-gradient(90deg,#00A650 0 33%,#F39800 33% 66%,#0079C2 66% 100%); }

  /* 카드 하단 '다음 이동' */
  .pc-next{ display:flex; align-items:center; flex-wrap:wrap; gap:5px; margin-top:9px;
    padding-top:9px; border-top:1px solid var(--line); }
  .nm-head{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:var(--ink); }
  .nm-head .icon{ width:12px; height:12px; }
  .nm-chain{ display:inline-flex; align-items:center; gap:4px; }
  .nm-line{ font-size:10.5px; font-weight:700; color:#fff; background:#7C4DFF;
    border-radius:5px; padding:2px 7px; }
  .nm-arrow{ color:var(--muted-2); font-size:11px; }
  .nm-tag{ font-size:9.5px; font-weight:700; color:#7C4DFF; border:1px solid #DCD1FF;
    border-radius:999px; padding:1px 6px; }
  .nm-meta{ font-size:11px; color:var(--muted); width:100%; }

  /* 경로 액션 버튼 */
  .rd-actions{ display:flex; gap:7px; margin-top:10px; flex-wrap:wrap; }
  .gmap-btn, .ai-btn{ display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:500;
    border-radius:var(--r-ctl); padding:10px 14px; cursor:pointer; text-decoration:none;
    border:none; background:var(--fill); color:var(--ink); letter-spacing:-.01em; }
  .gmap-btn .icon, .ai-btn .icon{ width:14px; height:14px; }
  .gmap-btn .icon{ color:var(--red); }
  .ai-btn{ background:var(--red-soft); color:var(--red); font-weight:600; }
  .ai-btn .icon{ color:var(--red); }
  .ai-btn:disabled{ opacity:.55; }
  .rd-est{ margin-top:6px; font-family:var(--font-mono); font-size:11.5px; color:var(--ink); }
  .rd-why{ display:block; width:100%; text-align:left; border:none; background:none; padding:9px 0 0;
    font-size:11px; color:var(--muted-2); cursor:pointer; }
  .rd-why::after{ content:' ⌄'; }
  .rd-why.open::after{ content:' ⌃'; }
  .rd-why-box{ font-size:11.5px; color:var(--muted); line-height:1.65; background:var(--tint);
    border-radius:var(--r-sm); padding:10px 12px; margin-top:7px; }

  /* AI 경로 결과 */
  .ai-route{ margin-top:10px; background:#F7F4FF; border:1px solid #E4DAFF;
    border-radius:var(--r-md); padding:13px; }
  .ai-route.loading{ color:var(--muted); font-size:12px; animation:pulse 1.3s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  .ai-route-tag{ font-size:10px; font-weight:700; color:#7C4DFF; letter-spacing:.02em; margin-bottom:5px; }
  .ai-route-sum{ font-size:13px; font-weight:700; line-height:1.45; margin-bottom:6px; }
  .ai-route .rd-steps{ border-left-color:#E0D4FF; }
  .ai-route-warn{ font-size:11px; color:var(--muted); line-height:1.6; margin-top:10px;
    padding-top:9px; border-top:1px solid #E4DAFF; }
  .rd-dot{ color:var(--muted-2); }
  .rd-chain{ display:flex; align-items:center; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .rd-seg{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600;
    border:1px solid var(--line-2); border-radius:7px; padding:4px 8px; color:var(--ink); background:#fff; }
  .rd-seg .icon{ width:12px; height:12px; }
  .rd-seg.walk{ border-style:dashed; color:var(--muted); }
  .rd-arrow{ color:var(--muted-2); font-size:12px; }

  .add-btn{ width:100%; padding:15px; border-radius:var(--r-card); border:none;
    background:#fff; color:var(--red); font-weight:500; font-size:15px; cursor:pointer; margin-top:12px;
    letter-spacing:-.02em; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .form-card{ background:#fff; border-radius:14px; padding:18px; margin-top:10px;
    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.07); }
  .form-card h3{ font-size:17px; margin:0 0 16px; font-weight:600; letter-spacing:-.02em; }
  .form-card label{ display:block; font-size:12.5px; color:var(--muted); font-weight:400; margin:16px 0 7px;
    letter-spacing:-.01em; }
  .form-card label.first{ margin-top:0; }
  .form-card input, .form-card select, .form-card textarea{
    width:100%; padding:13px 14px; border-radius:11px; border:none;
    font-size:16px; font-family:inherit; background:var(--fill); letter-spacing:-.02em; }
  .form-card input:focus, .form-card textarea:focus{ outline:2px solid var(--red-soft); outline-offset:0; }
  .form-card textarea{ resize:vertical; min-height:46px; }
  .geo-row{ display:flex; gap:8px; }
  .geo-row input{ flex:1; }
  .geo-btn{ flex:0 0 auto; border:none; border-radius:var(--r-sm); background:var(--ink); color:#fff;
    padding:0 15px; font-size:12.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .geo-results{ margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .geo-result{ text-align:left; border:1px solid var(--line-2); background:#fff; border-radius:var(--r-sm);
    padding:10px 11px; font-size:12px; cursor:pointer; line-height:1.45; }
  .geo-result{ display:flex; align-items:flex-start; gap:9px; }
  .geo-result.picked{ border-color:var(--red); background:var(--red-soft); }
  .gr-ic{ flex:0 0 16px; width:16px; height:16px; color:var(--muted-2); margin-top:1px; display:inline-flex; }
  .gr-ic svg{ width:100%; height:100%; }
  .geo-result.picked .gr-ic{ color:var(--red); }
  .gr-txt{ min-width:0; }
  .geo-result b{ font-weight:700; font-size:13px; display:block; }
  .geo-sub{ color:var(--muted); font-size:11.5px; display:block; margin-top:2px; line-height:1.4; }
  .geo-results{ max-height:300px; overflow-y:auto; }
  .mini-map{ height:230px; border-radius:var(--r-sm); overflow:hidden; margin-top:8px; border:1px solid var(--line-2); }
  .form-actions{ display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }
  .btn-primary{ flex:1; min-width:120px; border:none; background:var(--ink); color:#fff; padding:14px;
    border-radius:var(--r-ctl); font-weight:600; font-size:15px; cursor:pointer; letter-spacing:-.02em; }
  .btn-ghost{ border:none; background:var(--fill); color:var(--ink); padding:14px 18px;
    border-radius:var(--r-ctl); font-weight:500; font-size:15px; cursor:pointer; letter-spacing:-.02em; }
  .btn-danger{ color:var(--red); background:var(--red-soft); }
  .hint{ font-size:11px; color:var(--muted); margin-top:8px; line-height:1.6; }

  /* ===== PREP ===== */
  #screen-prep{ overflow-y:auto; background:#F5F5F8; }
  .prep-body{ padding:18px 18px 120px; }
  .prep-group{ margin-bottom:22px; }
  .prep-group h2{ font-size:14px; font-weight:600; margin:0 0 9px; padding-left:3px;
    letter-spacing:-.02em; color:var(--muted); display:flex; align-items:center; gap:7px; }
  .prep-group h2::before{ content:''; width:4px; height:14px; border-radius:2px; background:var(--gc, var(--red)); }
  .prep-item{ display:flex; gap:12px; align-items:flex-start; background:#fff; border-radius:13px;
    padding:15px; margin-bottom:7px; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .prep-item:active{ background:var(--fill); }
  .prep-item .box{ width:21px;height:21px; flex:0 0 21px; border:1.5px solid var(--muted-2); border-radius:50%;
    margin-top:1px; display:flex; align-items:center; justify-content:center; color:#fff;
    transition:background .2s var(--ease), border-color .2s var(--ease); }
  .prep-item.done .box{ background:var(--c-sight); border-color:var(--c-sight); }
  .prep-item .t{ font-size:15px; font-weight:500; letter-spacing:-.02em; }
  .prep-item .d{ font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.5; }
  .prep-item.done .t{ color:var(--muted); }
  .progress{ background:#fff; border-radius:var(--r-md); padding:16px; margin-bottom:20px; box-shadow:0 2px 10px rgba(26,26,30,.05); }
  .progress .top{ display:flex; justify-content:space-between; align-items:baseline; }
  .progress .top span:first-child{ font-size:12.5px; color:var(--muted); font-weight:600; }
  .progress .top span:last-child{ font-family:var(--font-mono); font-size:13.5px; font-weight:600; }
  .progress .bar{ height:6px; background:var(--line); border-radius:99px; margin-top:11px; overflow:hidden; }
  .progress .fill{ height:100%; border-radius:99px; width:0%; transition:width .3s var(--ease);
    background:linear-gradient(90deg,#3D6FD6,#1F8C63); }
  .prep-caption{ font-size:11.5px; color:var(--muted-2); margin:-8px 0 18px; padding-left:2px; }

  /* ===== NAV ===== */
  .bottomnav{ display:flex; border-top:.5px solid rgba(0,0,0,.12);
    background:rgba(255,255,255,.88); backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    padding-bottom:env(safe-area-inset-bottom); z-index:600; }
  .navbtn{ flex:1; border:none; background:none; padding:11px 4px 10px; display:flex; flex-direction:column;
    align-items:center; gap:5px; color:var(--muted-2); cursor:pointer; }
  .navbtn .icon{ width:20px; height:20px; }
  .navbtn .lb{ font-size:10.5px; font-weight:500; letter-spacing:-.01em; }
  .navbtn:active{ opacity:.45; }
  .navbtn.active{ color:var(--ink); }
  .navbtn.active .icon{ color:var(--red); }

  /* ===== MODAL ===== */
  .modal-bg{ position:fixed; inset:0; background:rgba(26,26,30,.5); display:none;
    align-items:flex-end; justify-content:center; z-index:1000; }
  .modal-bg.open{ display:flex; animation:fadeIn .18s ease; }
  .modal-bg.open .modal{ animation:sheetUp .26s cubic-bezier(.2,.9,.3,1); }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes sheetUp{ from{ transform:translateY(26px); } to{ transform:none; } }
  .modal{ width:100%; max-width:520px; background:#fff; border-radius:20px 20px 0 0;
    max-height:86vh; overflow-y:auto; padding:10px 20px 26px; position:relative; }
  .modal::before{ content:''; display:block; width:36px; height:5px; border-radius:3px;
    background:#D8D8DD; margin:0 auto 16px; }
  .modal h2{ font-size:21px; font-weight:700; margin:0 0 6px; letter-spacing:-.03em; }
  .modal .sub{ font-size:12.5px; color:var(--muted); margin:0 0 16px; line-height:1.6; }
  .modal-close{ position:absolute; top:26px; right:18px; border:none; background:var(--tint);
    border-radius:50%; width:28px;height:28px; cursor:pointer; color:var(--muted);
    display:flex;align-items:center;justify-content:center; }
  .sugg-card{ background:var(--tint); border-radius:var(--r-md); padding:14px; margin-bottom:8px; }
  .sugg-card .name{ font-weight:700; font-size:14.5px; }
  .sugg-card .cat{ font-size:11px; color:var(--red); font-weight:700; margin:3px 0 7px; }
  .sugg-card .reason{ font-size:12.5px; color:var(--muted); line-height:1.6; margin-bottom:11px; }
  .sugg-add{ border:none; background:var(--ink); color:#fff; font-size:12px; font-weight:600;
    padding:8px 13px; border-radius:999px; cursor:pointer; }
  .ai-status{ font-size:12px; color:var(--muted); margin:12px 0; min-height:18px; line-height:1.55; }
  .ai-choice{ display:flex; gap:8px; }
  .ai-choice .btn-primary{ flex:1; min-width:0; padding:13px 10px; font-size:13px; }
  .ai-choice .btn-primary.disabled{ background:var(--line-2); color:#fff; cursor:not-allowed; }
  .ai-error{ color:var(--red); }

  .disabled-box{ background:var(--tint); border:1px dashed var(--line-2); border-radius:var(--r-md);
    padding:20px 16px; text-align:center; }

/* ---- 안(案) : 하루에 여러 계획을 두고 비교 ---- */
function dayPlans(day){
  if(!day) return [];
  if(!Array.isArray(day.plans) || !day.plans.length) day.plans = [{ id:'p1', name:'1안' }];
  return day.plans;
}
function activePlanId(day){
  const ps = dayPlans(day);
  if(!day.activePlan || !ps.some(p=>p.id===day.activePlan)) day.activePlan = ps[0].id;
  return day.activePlan;
}
/* plan 값이 없으면 모든 안에 공통으로 들어갑니다 */
function inActivePlan(day, stop){
  if(!stop.plan) return true;
  return stop.plan === activePlanId(day);
}
function addPlan(day){
  const ps = dayPlans(day);
  const np = { id:'p'+Date.now().toString(36), name:`${ps.length+1}안` };
  ps.push(np);
  day.activePlan = np.id;
  markChanged();
}
function removePlan(day, planId){
  const ps = dayPlans(day);
  if(ps.length<=1) return false;
  day.plans = ps.filter(p=>p.id!==planId);
  day.stops = day.stops.filter(x=> x.plan!==planId);
  day.activePlan = day.plans[0].id;
  markChanged();
  return true;
}

/* 화면에 반영할 일정 (현재 안 + 선택 일정 제외 모드 반영) */

  if(!day) return [];
  return day.stops.filter(s=> inActivePlan(day,s) && (showOptional || !s.opt));
}
function midTime(a,b){
  const toM=h=>{ const m=/^(\d{1,2}):(\d{2})$/.exec(h||''); return m? (+m[1])*60+(+m[2]) : null; };
  const x=toM(a), y=toM(b);
  if(x==null) return b||'12:00';
  if(y==null) return a;
  const t=Math.round((x+y)/2);
  return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
}

const DOW = ['일','월','화','수','목','금','토'];
function fmtDate(iso){ if(!iso) return '--/--'; const p=iso.split('-'); return `${p[1]}/${p[2]}`; }
function fmtDow(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return isNaN(d)? '' : DOW[d.getDay()]; }
function fmtRange(){

}

function haversineKm(a,b){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function estimateMinutes(km, mode){
  const m = MODES.find(x=>x.key===mode) || MODES[0];
  return Math.max(1, Math.round(km*1.28 / m.kmh * 60 + m.fixed));
}
function fmtMin(m){ if(m<60) return `${m}분`; const h=Math.floor(m/60), r=m%60; return r? `${h}시간 ${r}분` : `${h}시간`; }

const LS_BACKUP = 'sapporo-backup:'+CFG.TRIP_ID;
function readBackups(){
  try{ return JSON.parse(localStorage.getItem(LS_BACKUP)||'[]'); }catch(e){ return []; }
}
function pushBackup(trip, why){
  if(!trip || !trip.days) return;
  try{
    const list = readBackups();
    const last = list[0];
    const body = JSON.stringify(trip);
    if(last && last.body===body) return;          // 같은 내용이면 건너뜀
    list.unshift({ at:Date.now(), why:why||'', count:trip.days.reduce((n,d)=>n+d.stops.length,0), body });
    localStorage.setItem(LS_BACKUP, JSON.stringify(list.slice(0,8)));
  }catch(e){}
}
function restoreBackup(idx){
  const list = readBackups();
  const b = list[idx];
  if(!b) return;
  try{
    pushBackup(TRIP, '복구 전');
    TRIP = JSON.parse(b.body);
    TRIP.updatedAt = Date.now();                  // 이 내용이 최신이 되도록
    writeLocal();
    if(HAS_SYNC && syncReady) cloudPut().catch(()=>{});
    activeDayId = TRIP.days.length? TRIP.days[0].id : null;
    activeStopId = null;
    refreshAll(); renderScheduleScreen();
    document.getElementById('statusModalBg').classList.remove('open');
    toast('이전 일정으로 되돌렸어요');
  }catch(e){ toast('복구하지 못했어요'); }
}
function encodeTrip(){
  const json = JSON.stringify(TRIP);
  const bytes = new TextEncoder().encode(json);
  let bin=''; bytes.forEach(b=> bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeTrip(str){
  try{
    const b64 = str.replace(/-/g,'+').replace(/_/g,'/');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){ return null; }
}

async function pullRemote(quiet){
  if(!HAS_SYNC) return;
  try{
    const remote = await cloudGet();
    if(remote && (remote.updatedAt||0) > (TRIP.updatedAt||0)){
      if(dayFormOpen || editingStopId!==null) return;
      pushBackup(TRIP, '서버 내용으로 갱신 전');
      TRIP = remote;
      TRIP.days.forEach(d=> d.stops.forEach(st=>{ if(st.mode) st.mode = normalizeMode(st.mode); }));
      writeLocal();
      if(!dayById(activeDayId)) activeDayId = TRIP.days[0] ? TRIP.days[0].id : null;
      activeStopId=null;
      refreshAll();
      if(!quiet) toast('친구가 수정한 일정을 불러왔어요');
    }
    setSyncLabel('동기화됨');
  }catch(e){ setSyncLabel('동기화 실패'); }
}

/* =========================================================
   OpenStreetMap(Overpass)에서 실제 노선 선형을 가져옵니다
   — 지하철·노면전차는 선로 모양이 잘 정리돼 있어요
   ========================================================= */
const AI_COLOR = '#7C4DFF';
const OSM_LS_KEY = 'osm-lines:sapporo:v2';
const OSM_TTL = 30*24*60*60*1000;          // 30일 캐시
const OVERPASS_ENDPOINTS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.osm.ch/api/interpreter'
];
let osmStatus = '아직 불러오지 않음';

/* 삿포로 주요 노선 별칭 — AI가 한국어로 답해도 매칭되도록 */
const LINE_ALIAS = [
  { keys:['난보쿠','남북','namboku','nanboku','南北'],   ja:'南北線',   color:'#00A650' },
  { keys:['도자이','동서','tozai','東西'],               ja:'東西線',   color:'#F39800' },
  { keys:['도호','동풍','toho','東豊'],                  ja:'東豊線',   color:'#0079C2' },
  { keys:['시덴','노면전차','전차','市電','streetcar','tram'], ja:'市電', color:'#E5006E' },
  { keys:['하코다테','函館'],                            ja:'函館本線', color:'#6C7A89' },
  { keys:['치토세','千歳','공항선','쾌속에어포트'],       ja:'千歳線',   color:'#1C6BBA' }
];

let osmLines = null, osmLoading = null;

function normText(x){ return String(x||'').toLowerCase().replace(/[\s·・\-]/g,''); }

function readOsmCache(){
  try{
    const raw = localStorage.getItem(OSM_LS_KEY);
    if(!raw) return null;
    const o = JSON.parse(raw);
    if(!o.at || Date.now()-o.at > OSM_TTL) return null;
    return o.lines;
  }catch(e){ return null; }
}
function writeOsmCache(lines){
  try{ localStorage.setItem(OSM_LS_KEY, JSON.stringify({ at:Date.now(), lines })); }catch(e){}
}

/* 관계(relation)의 여러 way를 이어붙여 하나의 선으로 */
function stitchWays(members){
  const ways = members.filter(m=>m.type==='way' && Array.isArray(m.geometry) && m.geometry.length>1)
                      .map(m=> m.geometry.map(g=>[g.lat, g.lon]));
  if(!ways.length) return [];
  const near=(a,b)=> Math.abs(a[0]-b[0])<0.0009 && Math.abs(a[1]-b[1])<0.0009;
  let path = ways.shift().slice();
  let guard = 0;
  while(ways.length && guard++ < 500){
    const end = path[path.length-1];
    let idx=-1, rev=false;
    for(let i=0;i<ways.length;i++){
      if(near(ways[i][0], end)){ idx=i; rev=false; break; }
      if(near(ways[i][ways[i].length-1], end)){ idx=i; rev=true; break; }
    }
    if(idx<0){ // 이어지지 않으면 그냥 다음 조각을 붙임
      path = path.concat(ways.shift());
      continue;
    }
    const seg = rev ? ways[idx].slice().reverse() : ways[idx];
    path = path.concat(seg.slice(1));
    ways.splice(idx,1);
  }
  return path;
}

async function loadOsmLines(){
  if(osmLines) return osmLines;
  const cached = readOsmCache();
  if(cached){ osmLines = cached; return osmLines; }
  if(osmLoading) return osmLoading;

  // out geom; 만 써야 멤버 지오메트리가 함께 옵니다 (out tags 를 붙이면 태그만 옵니다)
  const q = `[out:json][timeout:90];
(
  relation["type"="route"]["route"~"^(subway|light_rail|tram)$"](42.85,141.10,43.30,141.65);
  relation["type"="route"]["route"="train"]["operator"~"JR"](42.85,141.10,43.30,141.65);
);
out geom;`;

  osmLoading = (async ()=>{
    for(const url of OVERPASS_ENDPOINTS){
      try{
        const res = await fetch(url, { method:'POST', body:'data='+encodeURIComponent(q),
          headers:{'Content-Type':'application/x-www-form-urlencoded'} });
        if(!res.ok) throw new Error('HTTP '+res.status);
        const data = await res.json();
        const lines = (data.elements||[]).map(el=>{
          const t = el.tags||{};
          return {
            name: t.name || t['name:ja'] || t.ref || '',
            nameEn: t['name:en'] || '',
            nameKo: t['name:ko'] || '',
            ref: t.ref || '',
            colour: t.colour || t.color || null,
            path: stitchWays(el.members||[])
          };
        }).filter(l=> l.path.length>3);

        if(!lines.length) throw new Error('노선 0건');
        osmLines = lines;
        osmStatus = `노선 ${lines.length}개 불러옴`;
        writeOsmCache(lines);
        console.info('[Overpass]', osmStatus, lines.map(l=>l.name));
        return lines;
      }catch(e){
        console.warn('[Overpass] 실패:', url, e.message);
      }
    }
    osmLines = [];
    osmStatus = '불러오지 못함 (직선으로 표시)';
    return osmLines;
  })().finally(()=>{ osmLoading = null; });
  return osmLoading;
}

/* AI가 준 노선 이름 → OSM 노선 찾기 */
function matchOsmLine(lineName){
  if(!osmLines || !osmLines.length) return null;
  const n = normText(lineName);
  if(!n) return null;

  const alias = LINE_ALIAS.find(a=> a.keys.some(k=> n.includes(normText(k))));
  const wanted = alias ? normText(alias.ja) : n;

  let best=null;
  for(const l of osmLines){
    const hay = normText(l.name + l.nameEn + (l.nameKo||'') + l.ref);
    if(hay.includes(wanted) || (alias && hay.includes(normText(alias.ja.replace('線',''))))){
      if(!best || l.path.length > best.path.length) best = l;
    }
  }
  if(best) return { path: best.path, color: best.colour || (alias? alias.color : null) || AI_COLOR };
  return alias ? { path:null, color: alias.color } : null;
}

/* 선 위에서 두 지점 사이 구간만 잘라냅니다 */
function nearestIndex(path, pt){
  let bi=0, bd=Infinity;
  for(let i=0;i<path.length;i++){
    const dy=path[i][0]-pt[0], dx=(path[i][1]-pt[1])*0.73;
    const d=dy*dy+dx*dx;
    if(d<bd){ bd=d; bi=i; }
  }
  return { idx:bi, dist:Math.sqrt(bd)*111 };   // 대략 km
}
function sliceLine(path, a, b){
  const A=nearestIndex(path,a), B=nearestIndex(path,b);
  if(A.dist>2.0 || B.dist>2.0) return null;    // 역이 노선에서 너무 멀면 포기
  const [s,e] = A.idx<=B.idx ? [A.idx,B.idx] : [B.idx,A.idx];
  const seg = path.slice(s, e+1);
  if(seg.length<2) return null;
  return A.idx<=B.idx ? seg : seg.slice().reverse();
}

/* AI가 추정한 대중교통 경로를 지도에 그립니다 */
async function drawAiRoute(from, to){
  const route = from.aiRoute;
  if(!route || !Array.isArray(route.steps) || !route.steps.length){
    drawPath([[from.lat,from.lng],[to.lat,to.lng]], { color:ROUTE_STYLE.transit.color, weight:3, dash:'2 7' });
    return;
  }

  const hasTransit = route.steps.some(st=> !String(st.mode||'').includes('도보'));
  if(hasTransit) await loadOsmLines();

  // 실제 노선 데이터로 그릴 수 있는 구간만 먼저 모읍니다
  const real = [];
  route.steps.forEach(st=>{
    if(String(st.mode||'').includes('도보')) return;
    const a=st.fromAt, b=st.toAt;
    if(!a || !b) return;
    const m = matchOsmLine(st.line || st.mode);
    const seg = (m && m.path) ? sliceLine(m.path, a, b) : null;
    if(seg) real.push({ seg, color:(m && m.color) || AI_COLOR, st, a, b });
  });

  if(real.length){
    // 선로 모양이 확인된 경우: 실제 노선 + 도보 구간
    real.forEach(r=>{
      drawPath(r.seg, { color:r.color, weight:6, dash:null });
      drawStationDot(r.a[0], r.a[1], r.color, `${r.st.from||''} · ${r.st.line||r.st.mode||''} 승차`);
      drawStationDot(r.b[0], r.b[1], r.color, `${r.st.to||''} · ${r.st.line||r.st.mode||''} 하차`);
    });
    route.steps.forEach(st=>{
      if(!String(st.mode||'').includes('도보')) return;
      if(st.fromAt && st.toAt) drawPath([st.fromAt, st.toAt], ROUTE_STYLE.walk);
    });
    return;
  }

  // 추정만 있는 경우: 장소와 장소를 직선으로 잇습니다
  drawPath([[from.lat,from.lng],[to.lat,to.lng]], { color:AI_COLOR, weight:4, dash:'10 6' });
}

/* 선택한 이동수단대로 실제 경로를 그립니다 */
async function drawRoutesForDay(){
  if(!HAS_DIR || !dirService) return;
  const token = ++routeToken;
  const day = currentDay(); if(!day) return;
  const pts = visibleStops(day).filter(s=>!s.tbd && s.lat!=null);

  for(let i=0;i<pts.length-1;i++){
    const from=pts[i], to=pts[i+1];
    const mode=normalizeMode(from.mode);
    const r = await requestRoute(from,to,modeToG(mode));
    if(token!==routeToken) return;        // 그 사이 날짜/수단이 바뀌면 중단
    if(!r || !r.ok){
      if(mode==='transit') await drawAiRoute(from, to);
      else drawPath([[from.lat,from.lng],[to.lat,to.lng]], { color:'#1A1A1E', weight:2, dash:'2 7' });
      continue;
    }

    if(mode==='transit' && (!r.steps || !r.steps.length)){
      await drawAiRoute(from, to);
    } else if(mode==='transit' && r.steps.length){
      r.steps.forEach(st=>{
        if(st.kind==='transit'){
          drawPath(st.path, { color: st.color || ROUTE_STYLE.transit.color, weight:6, dash:null });
          const a=st.path[0], b=st.path[st.path.length-1];
          if(a) drawStationDot(a[0],a[1], st.color||ROUTE_STYLE.transit.color, `${st.from} · ${st.name} 승차`);
          if(b) drawStationDot(b[0],b[1], st.color||ROUTE_STYLE.transit.color, `${st.to} · ${st.name} 하차`);
        } else {
          drawPath(st.path, ROUTE_STYLE.walk);
        }
      });
    } else if(mode==='walk'){
      drawPath(r.overview.length? r.overview : [], ROUTE_STYLE.walk);
    } else {
      drawPath(r.overview.length? r.overview : [], ROUTE_STYLE.drive);
    }
  }
}
function groupViewOf(g){
  const act=g.items.find(it=>it.stop.id===activeStopId);
  return { shown: act || g.items[0], active: !!act, multi: g.items.length>1 };
}

/* 마커를 새로 만들지 않고 강조 상태만 바꿉니다 (부드럽고 빠름) */
function refreshMarkerStyles(){
  if(engine==='leaflet'){
    lMarkers.forEach(mk=>{
      const g=mk._group; if(!g) return;
      const v=groupViewOf(g), size=v.active?34:27;
      mk.setIcon(L.divIcon({ className:'pin-wrap', html:pinHtml(v.shown.num, v.active, v.multi, catC(v.shown.stop.cat)),
        iconSize:[size,size], iconAnchor:[size/2,size-2] }));
      mk.setZIndexOffset(v.active? 1000 : 0);
    });
  } else {
    gMarkers.forEach(mk=>{
      const g=mk._group; if(!g) return;
      const v=groupViewOf(g);
      mk.setLabel({ text:String(v.shown.num), color:'#fff', fontSize:'11px', fontWeight:'600' });
      mk.setIcon({ path:google.maps.SymbolPath.CIRCLE, fillColor:v.active?'#1C1C1E':catC(v.shown.stop.cat),
        fillOpacity:1, strokeColor:'#fff', strokeWeight:2.5, scale:v.active?15:12 });
      mk.setZIndex(v.active? 1000 : 1);
    });
  }
}

function renderMapForDay(){
  const day=currentDay(); clearMapLayers();
  if(!day) return;
  const withLoc = visibleStops(day).filter(s=>!s.tbd && s.lat!=null);
  if(!withLoc.length) return;
  // 같은 좌표에 여러 일정이 있으면 핀 하나로 묶고, 지금 보고 있는 카드의 번호를 보여줍니다
  const groups=[];
  withLoc.forEach((s,i)=>{
    const key=`${s.lat.toFixed(5)},${s.lng.toFixed(5)}`;
    let g=groups.find(x=>x.key===key);
    if(!g){ g={key, lat:s.lat, lng:s.lng, items:[]}; groups.push(g); }
    g.items.push({ stop:s, num:i+1 });
  });
  const groupView = groupViewOf;
  function groupClick(g){
    const i=g.items.findIndex(it=>it.stop.id===activeStopId);
    const next=g.items[(i+1) % g.items.length];   // 겹친 핀은 누를 때마다 다음 일정으로
    selectStop(next.stop.id, true, true);
  }

  if(engine==='leaflet'){
    const pts=[];
    groups.forEach(g=>{
      const v=groupView(g), size=v.active?34:27;
      const mk=L.marker([g.lat,g.lng],{
        icon:L.divIcon({className:'pin-wrap', html:pinHtml(v.shown.num, v.active, v.multi, catC(v.shown.stop.cat)),
          iconSize:[size,size], iconAnchor:[size/2,size-2]}),
        zIndexOffset: v.active? 1000 : 0,
        riseOnHover:true
      }).addTo(lmap);
      mk.on('click', ()=> groupClick(g));
      mk._group = g;
      lMarkers.push(mk);
    });
    withLoc.forEach(s=> pts.push([s.lat,s.lng]));
    if(!HAS_DIR) lLine=L.polyline(pts,{color:'#1A1A1E',weight:2,opacity:.4,dashArray:'1 7'}).addTo(lmap);
    if(!activeStopId) lmap.fitBounds(L.latLngBounds(pts),{padding:[46,46],maxZoom:13});
  } else {
    const pts=[];
    groups.forEach(g=>{
      const v=groupView(g);
      const mk=new google.maps.Marker({
        position:{lat:g.lat,lng:g.lng}, map:gmap,
        label:{text:String(v.shown.num),color:'#fff',fontSize:'11px',fontWeight:'600'},
        icon:{ path:google.maps.SymbolPath.CIRCLE, fillColor:v.active?'#1C1C1E':catC(v.shown.stop.cat),
          fillOpacity:1, strokeColor:'#fff', strokeWeight:2.5, scale:v.active?15:12 },
        zIndex: v.active? 1000 : 1,
        title: v.multi? `${g.items.map(it=>it.num).join(', ')}번 일정` : ''
      });
      mk.addListener('click', ()=> groupClick(g));
      mk._group = g;
      gMarkers.push(mk);
    });
    withLoc.forEach(s=> pts.push({lat:s.lat,lng:s.lng}));
    if(!HAS_DIR) gLine=new google.maps.Polyline({path:pts,map:gmap,strokeColor:'#1A1A1E',strokeOpacity:.45,strokeWeight:2});
    if(!activeStopId){ const b=new google.maps.LatLngBounds(); pts.forEach(p=>b.extend(p)); gmap.fitBounds(b,60); }
  }
  drawRoutesForDay();
}
function panTo(lat,lng,zoom){
  const z = zoom || 14;
  if(engine==='leaflet'){
    const cur = lmap.getZoom();
    if(Math.abs(cur - z) < 0.6){
      lmap.panTo([lat,lng], { animate:true, duration:0.45, easeLinearity:0.28 });
    } else {
      lmap.flyTo([lat,lng], z, { animate:true, duration:0.7, easeLinearity:0.25 });
    }
  } else {
    if(gmap.getZoom() !== z) gmap.setZoom(z);
    gmap.panTo({lat,lng});
  }
}
function bootGoogleMaps(){
  window.__gmapReady=()=>{
    try{
      document.getElementById('map').style.display='none';
      document.getElementById('gmap').style.display='block';
      gmap=new google.maps.Map(document.getElementById('gmap'),{
        center:{lat:43.06,lng:141.35}, zoom:9, disableDefaultUI:true, gestureHandling:'greedy',
        styles:[{featureType:'poi',elementType:'labels',stylers:[{visibility:'simplified'}]},
                {featureType:'transit',elementType:'labels',stylers:[{visibility:'off'}]}]
      });
      engine='google';
      if(HAS_DIR && google.maps.DirectionsService) dirService=new google.maps.DirectionsService();
      activeStopId=null; renderMapForDay(); renderCarousel();
    }catch(e){ console.error(e); }
  };
  const sc=document.createElement('script');
  sc.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(CFG.GOOGLE_MAPS_API_KEY)}&callback=__gmapReady&libraries=places&language=ko&region=JP`;
  sc.async=true;
  sc.onerror=()=> console.warn('구글 지도를 불러오지 못해 기본 지도를 사용합니다.');
  document.head.appendChild(sc);
}

/* ================= CAROUSEL ================= */
function selectStop(id, fly, scrollCard){
  activeStopId=id;
  const info=stopById(id);
  if(info && !info.stop.tbd && fly) panTo(info.stop.lat, info.stop.lng, 14);
  refreshMarkerStyles();          // 마커를 다시 그리지 않아 끊김이 없어요
  updateCardActive();
  if(scrollCard) scrollCardIntoCenter(id);
}
function updateCardActive(){
  document.querySelectorAll('.place-card').forEach(el=> el.classList.toggle('active', Number(el.dataset.id)===activeStopId));
}
function scrollCardIntoCenter(id){
  const wrap=document.getElementById('carousel');
  const card=wrap.querySelector(`.place-card[data-id="${id}"]`);
  if(!card) return;
  suppressScrollSync=true;
  wrap.scrollTo({ left: card.offsetLeft-(wrap.clientWidth-card.offsetWidth)/2, behavior:'smooth' });
  setTimeout(()=>{ suppressScrollSync=false; }, 500);
}
function setCarouselMetrics(){
  const wrap=document.getElementById('carousel');
  const w=wrap.clientWidth||380, cardw=Math.round(Math.min(300, w*0.78));
  wrap.style.setProperty('--cardw', cardw+'px');
  wrap.style.setProperty('--edge', ((w-cardw)/2-5)+'px');
}
function renderCarousel(){
  const day=currentDay(), wrap=document.getElementById('carousel');
  wrap.innerHTML=''; setCarouselMetrics();
  if(!day || !visibleStops(day).length){
    wrap.innerHTML=`<div class="place-card empty">표시할 일정이 없어요.<br>일정표 탭에서 장소를 추가해보세요.</div>`;
    return;
  }
  const list=visibleStops(day);
  const withLoc=list.filter(s=>!s.tbd && s.lat!=null);
  if(!activeStopId && withLoc.length) activeStopId=withLoc[0].id;
  list.forEach(s=>{
    const idx=withLoc.indexOf(s);
    const card=document.createElement('div');
    card.className='place-card'+(s.id===activeStopId?' active':'');
    card.dataset.id=s.id;
    const rating = s.rating? `<span class="pc-rating"><span class="star">★</span> ${s.rating} <span class="rc">(리뷰 ${s.ratingCount})</span></span>`:'';
    const cc = s.tbd? '#C4C4C8' : catC(s.cat);
    card.innerHTML=`
      <div class="pc-top">
        <span class="pc-num" style="background:${cc}">${idx>=0? idx+1:'–'}</span>
        <span class="pc-time">${fmtClock(s.time)}</span>
        <span class="pc-chip" style="background:${catS(s.cat)};color:${cc}">
          <span class="icon">${iconSvg(CATS[s.cat])}</span>${s.cat}</span>
      </div>
      <div class="pc-name">${esc(s.name)}</div>
      <div class="pc-note">${esc(s.note||'')}</div>
      ${nextMoveHtml(s, day)}
      <div class="pc-foot">${rating}${s.tbd?'<span class="tbd-badge">위치 미정</span>':''}</div>`;
    card.addEventListener('click', ()=> selectStop(s.id,true,true));
    wrap.appendChild(card);
  });
  setTimeout(()=> scrollCardIntoCenter(activeStopId), 60);
}
/* 카드 하단에 "다음 이동" 요약 (AI 추정 노선 포함) */
function nextMoveHtml(stop, day){
  const list = visibleStops(day);
  const i = list.findIndex(x=>x.id===stop.id);
  const next = list[i+1];
  if(!next) return '';
  const mode = normalizeMode(stop.mode);
  const m = MODES.find(x=>x.key===mode) || MODES[0];

  let chain='';
  if(mode==='transit' && stop.aiRoute && Array.isArray(stop.aiRoute.steps)){
    const segs = stop.aiRoute.steps.filter(st=> !String(st.mode||'').includes('도보'));
    if(segs.length){
      chain = segs.slice(0,3).map(st=>
        `<span class="nm-line">${esc(st.line||st.mode||'')}</span>`
      ).join('<span class="nm-arrow">›</span>');
    }
  }
  const fare = (mode==='transit' && stop.aiRoute && stop.aiRoute.fare) ? ` · ${esc(String(stop.aiRoute.fare))}` : '';
  const mins = (mode==='transit' && stop.aiRoute && stop.aiRoute.minutes) ? ` · 약 ${esc(String(stop.aiRoute.minutes))}분` : '';

  return `<div class="pc-next">
      <span class="nm-head"><span class="icon">${iconSvg(m.icon)}</span>${m.label}</span>
      ${chain? `<span class="nm-chain">${chain}</span><span class="nm-tag">AI 추정</span>`:''}
      <span class="nm-meta">${esc(next.name)}까지${mins}${fare}</span>
    </div>`;
}

function onCarouselScroll(){
  if(suppressScrollSync) return;
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{
    const wrap=document.getElementById('carousel');
    const center=wrap.scrollLeft+wrap.clientWidth/2;
    let best=null,bestD=Infinity;
    wrap.querySelectorAll('.place-card').forEach(c=>{
      const d=Math.abs((c.offsetLeft+c.offsetWidth/2)-center);
      if(d<bestD){ bestD=d; best=c; }
    });
    if(!best||!best.dataset.id) return;
    const id=Number(best.dataset.id);
    if(id!==activeStopId) selectStop(id,true,false);
  },70);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderDayChips(containerId, afterClick){
  const wrap=document.getElementById(containerId);
  if(!wrap){ console.warn('[일정] 날짜 칩 영역을 찾지 못했어요:', containerId); return; }
  wrap.innerHTML='';
  TRIP.days.forEach(d=>{
    const el=document.createElement('button');
    el.className='daychip'+(d.id===activeDayId?' active':'');
    el.innerHTML=`<span class="d">${fmtDate(d.iso)} ${fmtDow(d.iso)}</span><span class="l">${esc(d.label||'일정')}</span>`;
    el.addEventListener('click', ()=>{
      activeDayId=d.id; activeStopId=null;
      renderDayChips(containerId, afterClick);
      afterClick();
    });
    wrap.appendChild(el);
  });
}

/* ================= SCHEDULE ================= */
function renderScheduleScreen(){
  try{ renderScheduleScreenInner(); }
  catch(err){
    console.error('[일정표 렌더 실패]', err);
    const wrap=document.getElementById('stopListEdit');
    if(wrap){
      wrap.innerHTML = `<div class="empty-note err">
        일정표를 그리는 중 문제가 생겼어요.<br>
        <span class="err-code">${esc(String(err && err.message || err))}</span><br>
        지도 탭의 일정은 그대로 있으니 안심하세요. 이 메시지를 알려주시면 고칠 수 있어요.</div>`;
    }
  }
}

function renderScheduleScreenInner(){
  const day=currentDay();
  const titleEl=document.getElementById('schedTitle');
  if(titleEl) titleEl.textContent = day? `${fmtDate(day.iso)} (${fmtDow(day.iso)}) · ${day.label}` : '일정표';
  renderDayChips('daybar', onDayChange);

  const flLb=document.getElementById('flightLabel');
  const flBtn=document.getElementById('flightBtn');
  const F=TRIP.flights;
  if(flLb && flBtn){
  if(F && (F.in||F.out)){
    const parts=[];
    if(F.in)  parts.push(`입국 ${F.in.time}`);
    if(F.out) parts.push(`출국 ${F.out.time}`);
    flLb.innerHTML = `<b>항공편</b> ${esc(parts.join(' · '))}`;
    flBtn.classList.add('set');
  } else {
    flLb.textContent='항공편 입력하기';
    flBtn.classList.remove('set');
  }
  }

  const stayLb=document.getElementById('stayLabel');
  const stayBtn=document.getElementById('stayBtn');
  const dIdx = TRIP.days.findIndex(x=>x.id===activeDayId);
  const dStay = dIdx>=0 ? stayForDayIndex(dIdx) : null;
  if(stayLb && stayBtn){
  if(dStay){
    stayLb.innerHTML = `<b>오늘 밤</b> ${esc(dStay.name)}`
      + (stayIsOwn(dIdx)? '' : ' <span class="stay-inherit">이어받음</span>');
    stayBtn.classList.add('set');
  } else {
    stayLb.textContent = '숙소 설정하기';
    stayBtn.classList.remove('set');
  }
  }

  const body = document.querySelector('.list-body');
  let wrap=document.getElementById('stopListEdit');
  if(!wrap && body){ wrap=document.createElement('div'); wrap.id='stopListEdit'; body.prepend(wrap); }
  // 폼이 표 안에 들어가 있으면 먼저 밖으로 빼둡니다 (표를 비울 때 같이 지워지지 않도록)
  const faKeep = document.getElementById('formArea');
  if(faKeep && body && faKeep.parentNode !== body) body.appendChild(faKeep);
  if(wrap) wrap.innerHTML='';
  let sumEl=document.getElementById('daySummary');
  if(!sumEl){
    sumEl=document.createElement('div'); sumEl.className='day-summary'; sumEl.id='daySummary';
    const hdr=document.querySelector('#screen-schedule .sec-header');
    if(hdr) hdr.appendChild(sumEl);
  }
  if(!day){ wrap.innerHTML=`<div class="empty-note">날짜가 없어요.<br>위의 "날짜" 버튼으로 여행 날짜를 추가해보세요.</div>`; sumEl.innerHTML=''; return; }

  renderPlanBar(day);
  renderDaySummary(day, sumEl);

  const list = visibleStops(day);
  if(!list.length){
    wrap.innerHTML = day.stops.length
      ? `<div class="empty-note">이 날은 모두 '선택' 일정이에요.<br>위에서 선택 일정을 켜면 보입니다.</div>`
      : `<div class="empty-note">이 날은 아직 일정이 비어있어요.</div>`;
    return;
  }

  const withLoc=list.filter(s=>!s.tbd && s.lat!=null);
  const tbl=document.createElement('div'); tbl.className='tbl';

  list.forEach((s,i)=>{
    const idx=withLoc.indexOf(s);
    tbl.appendChild(rowEl(s, idx));
    const next=list[i+1];
    if(next) tbl.appendChild(moveBar(s, next));
  });
  wrap.appendChild(tbl);
}

/* 표 한 줄 */
function rowEl(s, idx){
  const el=document.createElement('div');
  el.className='trow'+(s.opt?' optional':'');
  el.dataset.id=s.id;
  const sub=[s.cat];
  if(s.place) sub.push(s.place);
  const cc = s.tbd ? '#C4C4C8' : catC(s.cat);
  el.innerHTML=`
    <div class="tc-num" style="background:${cc}">${idx>=0? idx+1:'?'}</div>
    <div class="tc-time">${esc(fmtClock(s.time))}</div>
    <div class="tc-main">
      <div class="tc-name">${esc(s.name)}
        ${s.opt? '<span class="mini-badge opt">선택</span>':''}
        ${s.stay? '<span class="mini-badge stay">숙소</span>':''}
        ${s.flight? `<span class="mini-badge fl">${s.flight==='in'?'입국':'출국'}</span>`:''}</div>
      <div class="tc-sub">${esc(sub.join(' · '))}</div>
    </div>
    <span class="tc-caret">›</span>`;
  el.addEventListener('click', ()=> openFormAt(el, s.id));
  return el;
}

/* 일정 사이 이동 줄 (접힌 상태) */
function moveBar(from, to){
  const bar=document.createElement('div');
  bar.className='tmove';
  const mode=normalizeMode(from.mode);
  const m=MODES.find(x=>x.key===mode)||MODES[0];
  const both = !from.tbd && !to.tbd && from.lat!=null && to.lat!=null;
  const km = both? haversineKm(from,to) : null;

  const known = both? knownLegMinutes(from,to) : null;
  let label = known? (known.src==='est'? `약 ${fmtMin(known.mins)}` : fmtMin(known.mins)) : '위치 미정';
  let extra = '';
  if(mode==='transit' && from.aiRoute && from.aiRoute.fare){
    extra = `<span class="tm-fare">${esc(String(from.aiRoute.fare))}</span>`;
  }
  if(mode==='taxi' && from.taxiFare){
    extra = `<span class="tm-fare">${esc(String(from.taxiFare))}</span>`;
  }

  bar.innerHTML=`
    <button type="button" class="tm-add" title="여기에 일정 추가">+</button>
    <button type="button" class="tm-open" style="--mc:${m.c}">
      <span class="icon" style="color:${m.c}">${iconSvg(m.icon)}</span>
      <span class="tm-label">${m.label} ${label}</span>
      ${extra}
      <span class="tm-caret">⌄</span>
    </button>
    <div class="tm-detail" hidden></div>`;

  bar.querySelector('.tm-add').addEventListener('click', (e)=>{
    e.stopPropagation();
    openFormAt(bar, null, { time: midTime(from.time, to.time), afterName: from.name, beforeName: to.name });
  });

  const openBtn=bar.querySelector('.tm-open');
  const box=bar.querySelector('.tm-detail');
  // 구글에서 실제 소요시간이 오면 줄을 갱신합니다
  primeLegTime(from, to, (v)=>{
    const lb=bar.querySelector('.tm-label');
    if(lb) lb.textContent = `${m.label} ${fmtMin(v.mins)}`;
    const sum=document.getElementById('daySummary');
    const d=currentDay();
    if(sum && d) renderDaySummary(d, sum);
  });
  openBtn.addEventListener('click', ()=>{
    if(box.hidden){
      box.innerHTML='';
      box.appendChild(buildLeg(from, to));
      box.hidden=false; openBtn.classList.add('open');

    }
  });
  return bar;
}

/* 하루 요약 — 확정/선택 개수와 이동시간 합계 */
function renderDaySummary(day, el){
  const all = day.stops.filter(s=> inActivePlan(day,s));
  const optCount = all.filter(s=>s.opt).length;
  const fixCount = all.length - optCount;

  const calc = (stops)=>{
    let total=0;
    const withLoc = stops.filter(s=>!s.tbd && s.lat!=null);
    for(let i=0;i<withLoc.length-1;i++){
      const k = knownLegMinutes(withLoc[i], withLoc[i+1]);
      if(k) total += k.mins;
    }
    return total;
  };
  const inPlan = day.stops.filter(s=> inActivePlan(day,s));
  const tAll = calc(inPlan);
  const tFix = calc(inPlan.filter(s=>!s.opt));

  el.innerHTML = `
    <div class="ds-left">
      <span class="ds-chip fix">확정 ${fixCount}</span>
      ${optCount? `<span class="ds-chip opt">선택 ${optCount}</span>`:''}
      <span class="ds-move">이동 약 ${fmtMin(showOptional? tAll : tFix)}</span>
      ${optCount && showOptional && tAll!==tFix? `<span class="ds-sub">선택 빼면 ${fmtMin(tFix)}</span>`:''}
    </div>
    ${optCount? `<button type="button" class="ds-toggle ${showOptional?'':'off'}" id="optToggle">
        ${showOptional? '선택 포함' : '선택 제외'}
      </button>`:''}`;

  const tg = document.getElementById('optToggle');
  if(tg) tg.addEventListener('click', ()=>{
    setShowOptional(!showOptional);
    activeStopId=null;
    renderScheduleScreen(); refreshAll();
    toast(showOptional? '선택 일정을 포함해서 보여요' : '확정 일정만 보여요');
  });
}

/* =========================================================
   경로 조회 (공통) — 지도와 일정표가 같은 결과를 씁니다
   ========================================================= */
const routeCache = {};
/* 구간별 실제 소요시간 기억: key → {mins, src} */
const legTimes = {};
function legKey(from,to,mode){ return `${from.id}-${to.id}-${normalizeMode(mode)}`; }
function knownLegMinutes(from,to){
  const mode = normalizeMode(from.mode);
  if(mode==='transit' && from.aiRoute && from.aiRoute.minutes){
    return { mins: Number(from.aiRoute.minutes), src:'ai' };
  }
  const hit = legTimes[legKey(from,to,mode)];
  if(hit) return hit;
  if(from.tbd || to.tbd || from.lat==null || to.lat==null) return null;
  return { mins: estimateMinutes(haversineKm(from,to), mode), src:'est' };
}
/* 접힌 이동 줄에 실제 값이 들어오면 화면을 갱신합니다 */
async function primeLegTime(from,to,onDone){
  const mode = normalizeMode(from.mode);
  if(mode==='transit') return;                       // 대중교통은 AI 값을 씁니다
  if(!HAS_DIR || !dirService) return;
  if(from.tbd || to.tbd || from.lat==null || to.lat==null) return;
  const k = legKey(from,to,mode);
  if(legTimes[k]) return;
  const r = await requestRoute(from,to,modeToG(mode));
  if(r && r.ok){ legTimes[k] = { mins:r.mins, src:'google' }; if(onDone) onDone(legTimes[k]); }
}
let lastDirStatus = null;

const DIR_STATUS_MSG = {
  ZERO_RESULTS:
    '이 구간의 경로를 찾지 못했어요. 거리가 아주 가깝거나 해당 수단의 운행 정보가 없는 구간일 수 있어요.',
  REQUEST_DENIED:
    'Directions API 요청이 거부됐어요(REQUEST_DENIED). Google Cloud Console에서 <b>Directions API</b>가 사용 설정되어 있는지 확인해주세요.',
  OVER_QUERY_LIMIT:
    '요청 한도를 넘었어요(OVER_QUERY_LIMIT). 잠시 후 다시 시도해주세요.',
  INVALID_REQUEST: '요청 형식이 올바르지 않아요(INVALID_REQUEST).',
  NOT_FOUND: '출발지나 도착지를 지도에서 찾지 못했어요(NOT_FOUND).',
  UNKNOWN_ERROR: '구글 서버에서 일시적인 오류가 발생했어요. 잠시 후 다시 시도해주세요.'
};
function dirStatusMsg(st){
  return DIR_STATUS_MSG[st] || `경로를 불러오지 못했어요 (${esc(String(st||'알 수 없음'))}).`;
}

function timeBucket(){ return Math.floor(Date.now()/(60*1000)); }
function modeToG(mode){ const m=MODES.find(x=>x.key===normalizeMode(mode)); return m? m.g : 'WALKING'; }

function requestRoute(from, to, g){
  const key = `${from.lat.toFixed(5)},${from.lng.toFixed(5)}|${to.lat.toFixed(5)},${to.lng.toFixed(5)}|${g}|${g==='TRANSIT'? timeBucket():'s'}`;
  if(routeCache[key]) return routeCache[key];

  const p = new Promise(resolve=>{
    if(!dirService) return resolve(null);
    const req = {
      origin:{lat:from.lat,lng:from.lng},
      destination:{lat:to.lat,lng:to.lng},
      travelMode: google.maps.TravelMode[g]
    };
    if(g==='TRANSIT') req.transitOptions = { departureTime: new Date() };
    dirService.route(req, (res, status)=>{
      if(status!=='OK' || !res.routes[0] || !res.routes[0].legs[0]){
        delete routeCache[key];
        if(status!=='ZERO_RESULTS') console.warn('[Directions]', g, status);
        lastDirStatus = status;
        return resolve({ ok:false, status });
      }
      const route=res.routes[0], lg=route.legs[0];
      resolve({
        ok:true,
        mins: Math.round(lg.duration.value/60),
        distance: lg.distance? lg.distance.text : null,
        fare: route.fare? route.fare.text : null,
        depart: lg.departure_time? lg.departure_time.text : null,
        departAt: lg.departure_time && lg.departure_time.value ? lg.departure_time.value.getTime() : null,
        arrive: lg.arrival_time? lg.arrival_time.text : null,
        overview: (route.overview_path||[]).map(pt=>[pt.lat(), pt.lng()]),
        steps: (lg.steps||[]).map(st=>{
          const path = (st.path||[]).map(pt=>[pt.lat(), pt.lng()]);
          const mins = Math.round((st.duration? st.duration.value:0)/60);
          if(st.travel_mode==='TRANSIT' && st.transit){
            const t=st.transit, line=t.line||{};
            return {
              kind:'transit', path, mins,
              name: line.short_name || line.name || '노선',
              full: line.name || '',
              vehicle: (line.vehicle && (line.vehicle.type || line.vehicle.name)) || '',
              color: line.color || null,
              textColor: line.text_color || null,
              from: (t.departure_stop||{}).name || '',
              to: (t.arrival_stop||{}).name || '',
              depart: t.departure_time? t.departure_time.text : null,
              departAt: t.departure_time && t.departure_time.value ? t.departure_time.value.getTime() : null,
              arrive: t.arrival_time? t.arrival_time.text : null,
              stops: t.num_stops || 0,
              headsign: t.headsign || ''
            };
          }
          return { kind: st.travel_mode==='WALKING' ? 'walk' : 'drive', path, mins,
                   dist: st.distance? st.distance.text : '' };
        })
      });
    });
  });

  routeCache[key] = p;
  return p;
}

/* 구글 지도 앱으로 바로 보내는 링크 */
const GMAP_MODE = { walk:'walking', transit:'transit', taxi:'driving', car:'driving' };
function gmapsDirUrl(from,to,mode){
  const m = GMAP_MODE[normalizeMode(mode)] || 'transit';
  return `https://www.google.com/maps/dir/?api=1`
    + `&origin=${from.lat},${from.lng}&destination=${to.lat},${to.lng}&travelmode=${m}`;
}

/* 역·정류장 이름을 좌표로 (구글 → OSM 순서, 결과는 캐시) */
const stationCache = {};
async function resolveStation(name){
  const raw = String(name||'').trim();
  if(!raw) return null;
  if(stationCache[raw] !== undefined) return stationCache[raw];
  const ja = /[（(]([^）)]+)[）)]/.exec(raw);
  const q = ja && /[\u3040-\u30ff\u4e00-\u9fff]/.test(ja[1]) ? ja[1] : raw.replace(/[（(].*?[）)]/g,'').trim();

  let found = null;
  if(typeof ensurePlaces==='function' && ensurePlaces()){
    found = await new Promise(resolve=>{
      placesService.findPlaceFromQuery(
        { query: `${q} 삿포로`, fields:['geometry','name'],
          locationBias: new google.maps.Circle({ center:{lat:SAPPORO.lat,lng:SAPPORO.lng}, radius:80000 }) },
        (res, status)=>{
          if(status===google.maps.places.PlacesServiceStatus.OK && res && res[0] && res[0].geometry){
            resolve([res[0].geometry.location.lat(), res[0].geometry.location.lng()]);
          } else resolve(null);
        });
    });
  }
  if(!found){
    try{
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ko,ja,en&viewbox=139.0,46.0,146.5,41.0&q=${encodeURIComponent(q+' 札幌')}`);
      const d = await r.json();
      if(d && d[0]) found = [parseFloat(d[0].lat), parseFloat(d[0].lon)];
    }catch(e){}
  }
  stationCache[raw] = found;
  return found;
}

async function geocodeAiRoute(route, from, to){
  if(!route || !Array.isArray(route.steps)) return route;
  for(const st of route.steps){
    if(!st.fromAt) st.fromAt = await resolveStation(st.from);
    if(!st.toAt)   st.toAt   = await resolveStation(st.to);
  }
  const first=route.steps[0], last=route.steps[route.steps.length-1];
  if(first && !first.fromAt) first.fromAt=[from.lat,from.lng];
  if(last  && !last.toAt)    last.toAt=[to.lat,to.lng];
  return route;
}

/* ---- 일본 공휴일 (Nager.Date, 키 불필요) ---- */
const holidayCache = {};
async function jpHolidays(year){
  if(holidayCache[year]) return holidayCache[year];
  const lsKey = `jp-holidays:${year}`;
  try{
    const raw = localStorage.getItem(lsKey);
    if(raw){ holidayCache[year]=JSON.parse(raw); return holidayCache[year]; }
  }catch(e){}
  try{
    const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/JP`);
    if(!res.ok) throw new Error(res.status);
    const list = await res.json();
    const map = {};
    list.forEach(h=>{ map[h.date] = h.localName || h.name; });
    holidayCache[year]=map;
    try{ localStorage.setItem(lsKey, JSON.stringify(map)); }catch(e){}
    return map;
  }catch(e){ holidayCache[year] = {}; return holidayCache[year]; }
}
async function dayContext(iso){
  if(!iso) return { date:'', weekday:'', dayType:'평일' };
  const d = new Date(iso+'T00:00:00');
  const wd = DOW[d.getDay()];
  const map = await jpHolidays(d.getFullYear());
  const holiday = map[iso] || null;
  let dayType = '평일';
  if(holiday) dayType = `공휴일(${holiday})`;
  else if(d.getDay()===0) dayType = '일요일';
  else if(d.getDay()===6) dayType = '토요일';
  return { date: iso, weekday: wd, dayType, holiday };
}
