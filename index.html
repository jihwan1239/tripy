<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 대중교통 길찾기 & 지도 표시</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; }
    
    /* 레이아웃: 좌측 패널 + 우측 지도 */
    #sidebar { width: 380px; height: 100%; padding: 20px; background: #f8f9fa; border-right: 1px solid #ddd; overflow-y: auto; }
    #map { flex: 1; height: 100%; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #555; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    
    button {
      width: 100%; padding: 12px; background: #4A90E2; color: white; border: none;
      border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    button:hover { background: #357ABD; }
    button:disabled { background: #aaa; cursor: not-allowed; }

    /* 노선 상세 카드 스타일 */
    .route-card { background: white; border-radius: 8px; padding: 16px; margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .rd-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #eee; margin-bottom: 12px; }
    .rd-dur { font-size: 20px; font-weight: bold; color: #2c3e50; }
    .rd-fare { font-size: 16px; font-weight: bold; color: #e74c3c; }
    
    .rd-steps { list-style: none; position: relative; padding-left: 20px; }
    .rd-steps::before { content: ''; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 2px; background: #ddd; }
    .rs { position: relative; margin-bottom: 16px; }
    .rs::before { content: ''; position: absolute; left: -18px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: #4A90E2; border: 2px solid white; }
    .rs.walk::before { background: #95a5a6; }
    .rs-kind { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #eef5ff; color: #2b6cb0; font-weight: bold; margin-bottom: 4px; }
    .rs-kind.walk { background: #f0f0f0; color: #666; }
    .rs-inst { font-size: 14px; color: #333; line-height: 1.4; }
    .rs-time { font-size: 12px; color: #888; margin-top: 2px; }
  </style>
</head>
<body>

  <!-- 좌측 입력 및 안내 패널 -->
  <div id="sidebar">
    <h2>AI 일본 대중교통 탐색</h2>
    <p style="font-size:12px; color:#666; margin-bottom:16px;">구글 API 요금/경로 미지원 구간을 AI로 보완하여 지도에 그립니다.</p>

    <div class="form-group">
      <label>출발지</label>
      <input type="text" id="startInput" value="삿포로역">
    </div>
    <div class="form-group">
      <label>도착지</label>
      <input type="text" id="endInput" value="조잔케이 온천">
    </div>
    <div class="form-group">
      <label>출발 시간</label>
      <input type="text" id="timeInput" value="오전 10:00">
    </div>

    <button id="searchBtn" onclick="handleSearch()">AI 노선 탐색 및 지도 표시</button>

    <!-- 노선 정보 출력 영역 -->
    <div id="routeResult"></div>
  </div>

  <!-- 우측 구글 지도 -->
  <div id="map"></div>

  <!-- Google Maps JavaScript API (YOUR_GOOGLE_MAPS_API_KEY를 본인 발급 키로 교체) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places"></script>

  <script>
    // Cloudflare Worker 프록시 URL 설정
    const AI_PROXY_URL = "https://your-worker.workers.dev"; // 실제 워커 URL로 교체

    let map;
    let geocoder;
    let mapMarkers = [];
    let mapPolyline = null;

    // 1. 지도 초기화 (삿포로 중심)
    function initMap() {
      geocoder = new google.maps.Geocoder();
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 43.0621, lng: 141.3544 }, // 삿포로 기본 좌표
        zoom: 12,
        mapTypeControl: false
      });
    }
    window.onload = initMap;

    // 2. 검색 버튼 클릭 핸들러
    async function handleSearch() {
      const start = document.getElementById("startInput").value;
      const end = document.getElementById("endInput").value;
      const time = document.getElementById("timeInput").value;
      const btn = document.getElementById("searchBtn");
      const resultDiv = document.getElementById("routeResult");

      if (!start || !end) return alert("출발지와 도착지를 입력하세요.");

      btn.disabled = true;
      btn.textContent = "AI가 경로 계산 및 지도 좌표 찾는 중...";
      resultDiv.innerHTML = "";

      try {
        // [A] AI 프록시에 노선 정보 요청
        const routeData = await fetchAITransitRoute(start, end, time);

        if (!routeData) throw new Error("노선 데이터를 가져오지 못했습니다.");

        // [B] 지도 위에 마커 및 경로 선 그리기
        await renderRouteOnMap(start, end, routeData);

        // [C] 좌측 패널에 정제된 텍스트 노선 정보 출력
        renderRouteUI(resultDiv, routeData);

      } catch (err) {
        alert("오류 발생: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "AI 노선 탐색 및 지도 표시";
      }
    }

    // 3. Cloudflare Worker로 API 요청
    async function fetchAITransitRoute(start, end, time) {
      try {
        const res = await fetch(AI_PROXY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "transit_route", start, end, time })
        });
        const data = await res.json();
        return data.route;
      } catch (e) {
        console.warn("Worker 호출 실패, 테스트용 더미 데이터를 반환합니다.");
        return {
          duration: "약 약 1시간 10분", // 중복 테스트용
          fare: "약 770엔",
          steps: [
            { mode: "transit", line: "갓파 라이너 버스", instruction: "삿포로역 버스터미널 12번 승차장에서 버스 탑승", time: "60분" },
            { mode: "walk", line: "도보", instruction: "조잔케이 온천 하차 후 숙소까지 이동", time: "10분" }
          ]
        };
      }
    }

    // 4. 지도 위에 좌표를 변환해 마커와 경로 선(Polyline) 그리기
    async function renderRouteOnMap(startName, endName, routeData) {
      // 기존 마커 및 선 제거
      mapMarkers.forEach(m => m.setMap(null));
      mapMarkers = [];
      if (mapPolyline) mapPolyline.setMap(null);

      const startLoc = await geocodeAddress(`${startName}, Hokkaido, Japan`);
      const endLoc = await geocodeAddress(`${endName}, Hokkaido, Japan`);

      if (!startLoc || !endLoc) {
        alert("지도에서 출발지 또는 도착지의 위치 정보를 찾을 수 없습니다.");
        return;
      }

      // 출발지 마커
      const startMarker = new google.maps.Marker({
        position: startLoc,
        map: map,
        title: "출발: " + startName,
        label: "A"
      });

      // 도착지 마커
      const endMarker = new google.maps.Marker({
        position: endLoc,
        map: map,
        title: "도착: " + endName,
        label: "B"
      });

      mapMarkers.push(startMarker, endMarker);

      // 직선/경로 선 생성 (출발 -> 도착)
      const pathCoordinates = [startLoc, endLoc];

      mapPolyline = new google.maps.Polyline({
        path: pathCoordinates,
        geodesic: true,
        strokeColor: "#4A90E2",
        strokeOpacity: 0.8,
        strokeWeight: 5
      });

      mapPolyline.setMap(map);

      // 두 지점이 모두 보이도록 자동 줌/영역 조절
      const bounds = new google.maps.LatLngBounds();
      bounds.extend(startLoc);
      bounds.extend(endLoc);
      map.fitBounds(bounds);
    }

    // 5. 주소/장소명을 LatLng 좌표로 변환 (Geocoding)
    function geocodeAddress(address) {
      return new Promise((resolve) => {
        geocoder.geocode({ address: address }, (results, status) => {
          if (status === "OK" && results[0]) {
            resolve(results[0].geometry.location);
          } else {
            console.error("지오코딩 실패:", address, status);
            resolve(null);
          }
        });
      });
    }

    // [방법 1 핵심] 중복된 '약' 텍스트 정제 함수
    function cleanAboutPrefix(str) {
      if (!str) return '';
      // '약'이 연속으로 수식되는 경우 하나로 통일 (예: "약 약 770엔" -> "약 770엔")
      return str.replace(/^(약\s*)+/g, '약 ').trim();
    }

    // 6. UI에 경로 카드 렌더링
    function renderRouteUI(container, route) {
      // cleanAboutPrefix 함수를 통해 '약 약' 현상 방지
      const durationText = cleanAboutPrefix(route.duration);
      const fareText = cleanAboutPrefix(route.fare);

      let html = `
        <div class="route-card">
          <div class="rd-head">
            <span class="rd-dur">${durationText}</span>
            <span class="rd-fare">${fareText}</span>
          </div>
          <ul class="rd-steps">
      `;

      (route.steps || []).forEach(step => {
        const isWalk = step.mode === 'walk';
        const stepTime = cleanAboutPrefix(step.time);
        
        html += `
          <li class="rs ${isWalk ? 'walk' : ''}">
            <span class="rs-kind ${isWalk ? 'walk' : ''}">${step.line || (isWalk ? '도보' : '대중교통')}</span>
            <div class="rs-inst">${step.instruction}</div>
            <div class="rs-time">${stepTime}</div>
          </li>
        `;
      });

      html += `</ul></div>`;
      container.innerHTML = html;
    }
  </script>
</body>
</html>
