<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#E03B4B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="삿포로" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<title>삿포로 여행 일정</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF; --ink:#1A1A1E; --muted:#8E8E96; --muted-2:#BFBFC6;
    --line:#EFEFF2; --line-2:#E2E2E8; --tint:#F8F8FA;
    --red:#E03B4B; --red-soft:#FDECEE;
    --shadow-card:0 6px 22px rgba(26,26,30,.10);
    --shadow-float:0 10px 30px rgba(26,26,30,.16);
    --font-body:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --r-lg:20px; --r-md:14px; --r-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{ background:#DCDCE0; color:var(--ink); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; overscroll-behavior:none; }
  button{font-family:inherit;}
  .app{ max-width:520px; margin:0 auto; height:100vh; height:100dvh;
    background:var(--paper); display:flex; flex-direction:column;
    position:relative; overflow:hidden; box-shadow:0 0 48px rgba(0,0,0,.18); }
  .icon{ display:inline-flex; width:17px; height:17px; }
  .icon svg{ width:100%; height:100%; }
  .screen{ flex:1; min-height:0; display:none; flex-direction:column; position:relative; }
  .screen.active{ display:flex; }

  /* ===== MAP ===== */
  #screen-map{ overflow:hidden; background:#E9E9ED; }
  #map, #gmap{ position:absolute; inset:0; }
  #gmap{ display:none; }
  .leaflet-tile-pane{ filter:grayscale(78%) contrast(1.05) brightness(1.05); }
  .leaflet-control-attribution{ display:none; }

  .float-head{ position:absolute; top:0; left:0; right:0; z-index:500;
    padding:12px 12px 0; display:flex; flex-direction:column; gap:14px; pointer-events:none; }
  .float-head > *{ pointer-events:auto; }

  .topbar{ background:#fff; border-radius:var(--r-lg); padding:12px 14px;
    display:flex; align-items:center; gap:11px; box-shadow:var(--shadow-card); }
  .topbar .mark{ width:32px;height:32px;flex:0 0 32px;border-radius:11px;background:var(--red-soft);
    display:flex;align-items:center;justify-content:center;color:var(--red); }
  .topbar .mark .icon{ width:17px;height:17px; }
  .topbar .tt{ min-width:0; flex:1; }
  .topbar h1{ font-size:15.5px; font-weight:700; margin:0; letter-spacing:-.015em; line-height:1.25; }
  .topbar .tsub{ font-size:11px; color:var(--muted-2); font-family:var(--font-mono); margin-top:2px;
    display:flex; align-items:center; gap:5px; }
  .topbar .tsub i{ width:5px;height:5px;border-radius:50%;background:var(--muted-2);display:block; }
  .topbar .tsub.sync i{ background:#35C27A; }
  .head-btn{ flex:0 0 auto; width:34px;height:34px; border:none; background:var(--tint);
    border-radius:12px; color:var(--muted); cursor:pointer; display:flex;align-items:center;justify-content:center; }
  .head-btn .icon{ width:16px;height:16px; }
  .head-btn.on{ background:var(--red-soft); color:var(--red); }

  .daybar{ display:flex; gap:7px; overflow-x:auto; padding:2px 1px 4px;
    -ms-overflow-style:none; scrollbar-width:none; }
  .daybar::-webkit-scrollbar{ display:none; }
  .daychip{ flex:0 0 auto; min-width:100px; background:#fff; color:var(--muted); border:none;
    border-radius:15px; padding:9px 12px; cursor:pointer; text-align:left;
    box-shadow:var(--shadow-card); transition:background .16s ease, color .16s ease; }
  .daychip .d{ display:block; font-family:var(--font-mono); font-size:10px; opacity:.7; margin-bottom:2px; }
  .daychip .l{ display:block; font-size:12.5px; font-weight:700; letter-spacing:-.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:130px; }
  .daychip.active{ background:var(--red); color:#fff; }
  .daychip.active .d{ opacity:.9; }

  .ai-fab{ position:absolute; right:14px; bottom:190px; z-index:500;
    background:var(--ink); color:#fff; border:none; border-radius:999px;
    padding:11px 16px; font-size:12.5px; font-weight:600;
    display:flex; align-items:center; gap:7px; box-shadow:var(--shadow-float); }
  .ai-fab .icon{ color:#FFD24C; width:14px; height:14px; }
  .ai-fab.off{ background:#fff; color:var(--muted-2); }
  .ai-fab.off .icon{ color:var(--muted-2); }

  .carousel-wrap{ position:absolute; left:0; right:0; bottom:0; z-index:500; padding-bottom:14px; }
  .carousel{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory;
    padding:14px 0 4px; -ms-overflow-style:none; scrollbar-width:none; }
  .carousel::-webkit-scrollbar{ display:none; }
  .carousel::before, .carousel::after{ content:''; flex:0 0 var(--edge); }
  .place-card{ scroll-snap-align:center; scroll-snap-stop:always; flex:0 0 var(--cardw);
    background:#fff; border-radius:var(--r-lg); padding:14px 16px 15px; cursor:pointer;
    box-shadow:var(--shadow-float); border:1.5px solid transparent; transition:border-color .18s ease; }
  .place-card.active{ border-color:var(--red); }
  .place-card.empty{ text-align:center; color:var(--muted); font-size:13px; padding:22px 16px; }
  .pc-top{ display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .pc-num{ width:22px;height:22px; border-radius:50%; background:var(--red); color:#fff;
    font-family:var(--font-mono); font-size:11px; font-weight:600;
    display:flex; align-items:center; justify-content:center; flex:0 0 22px; }
  .pc-num.tbd{ background:var(--muted-2); }
  .pc-time{ font-family:var(--font-mono); font-size:12.5px; font-weight:600; }
  .pc-chip{ margin-left:auto; display:flex;align-items:center;gap:5px; background:var(--tint);
    color:var(--muted); border-radius:999px; padding:4px 9px; font-size:10.5px; font-weight:600; }
  .pc-chip .icon{ width:12px;height:12px; }
  .pc-name{ font-size:16px; font-weight:700; margin:0 0 6px; line-height:1.32; letter-spacing:-.015em; }
  .pc-note{ font-size:12.5px; color:var(--muted); line-height:1.5; }
  .pc-foot{ display:flex; align-items:center; gap:8px; margin-top:9px; }
  .pc-rating{ font-size:12px; }
  .pc-rating .star{ color:#FFB020; }
  .pc-rating .rc{ color:var(--muted-2); }
  .tbd-badge{ font-size:10.5px; color:var(--muted); background:var(--tint); border-radius:999px; padding:3px 9px; }

  /* ===== SCHEDULE ===== */
  #screen-schedule{ overflow-y:auto; background:var(--tint); }
  .sec-header{ padding:20px 20px 14px; background:#fff; position:sticky; top:0; z-index:10; border-bottom:1px solid var(--line); }
  .sec-title-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .sec-header h1{ font-size:20px; font-weight:700; margin:0; letter-spacing:-.02em; flex:1; min-width:0; }
  .mini-btn{ flex:0 0 auto; border:1px solid var(--line-2); background:#fff; color:var(--ink);
    border-radius:999px; padding:7px 12px; font-size:11.5px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:5px; }
  .mini-btn .icon{ width:13px;height:13px; }
  .sched-days{ display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; }
  .sched-days::-webkit-scrollbar{ display:none; }
  .sched-days .daychip{ box-shadow:none; background:var(--tint); }
  .sched-days .daychip.active{ background:var(--red); color:#fff; }
  .list-body{ padding:16px 18px 120px; }
  .empty-note{ background:#fff; border-radius:var(--r-md); padding:26px 18px; text-align:center;
    color:var(--muted); font-size:13px; line-height:1.7; box-shadow:0 2px 10px rgba(26,26,30,.05); }

  .stop{ display:flex; gap:12px; background:#fff; border-radius:var(--r-md); padding:14px; box-shadow:0 2px 10px rgba(26,26,30,.05); }
  .stop .num{ flex:0 0 22px; height:22px; border-radius:50%; background:var(--red); color:#fff;
    font-family:var(--font-mono); font-size:10.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; margin-top:2px; }
  .stop .num.tbd{ background:var(--muted-2); }
  .stop .body{ flex:1; min-width:0; }
  .stop .time{ font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--red); }
  .stop .name{ font-size:15px; font-weight:700; margin:3px 0; letter-spacing:-.015em; }
  .stop .note{ font-size:12.5px; color:var(--muted); line-height:1.5; }
  .stop .loc{ display:flex; align-items:flex-start; gap:5px; font-size:11.5px; color:var(--muted-2); margin-top:6px; line-height:1.45; }
  .stop .loc .icon{ width:12px;height:12px; flex:0 0 12px; margin-top:1px; }
  .stop .row2{ display:flex; align-items:center; gap:9px; margin-top:9px; }
  .stop .tag{ font-size:10.5px; color:var(--muted); background:var(--tint); border-radius:999px; padding:3px 9px; font-weight:600; }
  .stop .edit-btn{ border:none; background:none; color:var(--ink); font-size:11.5px; font-weight:700; cursor:pointer; padding:0; margin-left:auto; }

  .leg{ display:flex; gap:12px; padding:4px 0; }
  .leg .rail{ flex:0 0 22px; display:flex; justify-content:center; }
  .leg .rail span{ width:2px; background:var(--line-2); border-radius:2px; min-height:56px; }
  .leg .legbody{ flex:1; padding:8px 0 8px 2px; }
  .leg .modes{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .leg .modes::-webkit-scrollbar{ display:none; }
  .mode{ flex:0 0 auto; display:flex; align-items:center; gap:5px;
    border:1px solid var(--line-2); background:#fff; color:var(--muted);
    border-radius:999px; padding:6px 11px; font-size:11.5px; font-weight:600; cursor:pointer; }
  .mode .icon{ width:13px;height:13px; }
  .mode .mins{ font-family:var(--font-mono); font-size:11px; }
  .mode.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .leg .legmeta{ font-size:11px; color:var(--muted-2); margin-top:6px; line-height:1.5; }
  .leg .legmeta .off{ color:var(--red); font-weight:600; }

  /* 경로 상세 (노선 · 출발시각 · 요금) */
  .route-detail{ margin-top:9px; }
  .route-detail:empty{ display:none; }
  .rd-head{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-size:12px; }
  .rd-time{ font-family:var(--font-mono); font-weight:600; color:var(--ink); }
  .rd-fare{ font-family:var(--font-mono); font-weight:600; color:var(--ink);
    background:var(--tint); border-radius:999px; padding:2px 9px; }
  .rd-board{ font-size:11.5px; color:var(--red); font-weight:600; }
  .rd-eta{ font-size:10.5px; font-weight:700; color:var(--muted); background:var(--tint);
    border-radius:999px; padding:2px 8px; margin-left:5px; }
  .rd-eta.soon{ color:var(--red); background:var(--red-soft); }
  .rd-dot{ color:var(--muted-2); }
  .rd-chain{ display:flex; align-items:center; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .rd-seg{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600;
    border:1px solid var(--line-2); border-radius:7px; padding:4px 8px; color:var(--ink); background:#fff; }
  .rd-seg .icon{ width:12px; height:12px; }
  .rd-seg.walk{ border-style:dashed; color:var(--muted); }
  .rd-arrow{ color:var(--muted-2); font-size:12px; }

  .add-btn{ width:100%; padding:14px; border-radius:var(--r-md); border:1.5px dashed var(--line-2);
    background:#fff; color:var(--ink); font-weight:700; font-size:13.5px; cursor:pointer; margin-top:14px; }
  .form-card{ background:#fff; border-radius:var(--r-md); padding:18px; margin-top:12px; box-shadow:var(--shadow-card); }
  .form-card h3{ font-size:14.5px; margin:0 0 14px; font-weight:700; }
  .form-card label{ display:block; font-size:11.5px; color:var(--muted); font-weight:600; margin:14px 0 6px; }
  .form-card label.first{ margin-top:0; }
  .form-card input, .form-card select, .form-card textarea{
    width:100%; padding:11px 13px; border-radius:var(--r-sm); border:1px solid var(--line-2);
    font-size:14px; font-family:inherit; background:var(--tint); }
  .form-card textarea{ resize:vertical; min-height:46px; }
  .geo-row{ display:flex; gap:8px; }
  .geo-row input{ flex:1; }
  .geo-btn{ flex:0 0 auto; border:none; border-radius:var(--r-sm); background:var(--ink); color:#fff;
    padding:0 15px; font-size:12.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .geo-results{ margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .geo-result{ text-align:left; border:1px solid var(--line-2); background:#fff; border-radius:var(--r-sm);
    padding:10px 11px; font-size:12px; cursor:pointer; line-height:1.45; }
  .geo-result.picked{ border-color:var(--red); background:var(--red-soft); }
  .form-actions{ display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }
  .btn-primary{ flex:1; min-width:120px; border:none; background:var(--ink); color:#fff; padding:13px;
    border-radius:var(--r-sm); font-weight:700; font-size:13.5px; cursor:pointer; }
  .btn-ghost{ border:1px solid var(--line-2); background:#fff; color:var(--ink); padding:13px 16px;
    border-radius:var(--r-sm); font-weight:600; font-size:13.5px; cursor:pointer; }
  .btn-danger{ color:var(--red); border-color:#F7CDD2; }
  .hint{ font-size:11px; color:var(--muted); margin-top:8px; line-height:1.6; }

  /* ===== PREP ===== */
  #screen-prep{ overflow-y:auto; background:var(--tint); }
  .prep-body{ padding:18px 18px 120px; }
  .prep-group{ margin-bottom:22px; }
  .prep-group h2{ font-size:14.5px; font-weight:700; margin:0 0 10px; padding-left:2px; }
  .prep-item{ display:flex; gap:11px; align-items:flex-start; background:#fff; border-radius:var(--r-md);
    padding:14px; margin-bottom:8px; cursor:pointer; box-shadow:0 2px 10px rgba(26,26,30,.05); }
  .prep-item .box{ width:19px;height:19px; flex:0 0 19px; border:1.5px solid var(--line-2); border-radius:7px;
    margin-top:1px; display:flex; align-items:center; justify-content:center; color:#fff; }
  .prep-item.done .box{ background:var(--red); border-color:var(--red); }
  .prep-item .t{ font-size:13.5px; font-weight:700; letter-spacing:-.015em; }
  .prep-item .d{ font-size:12px; color:var(--muted); margin-top:4px; line-height:1.55; }
  .prep-item.done .t{ color:var(--muted); }
  .progress{ background:#fff; border-radius:var(--r-md); padding:16px; margin-bottom:20px; box-shadow:0 2px 10px rgba(26,26,30,.05); }
  .progress .top{ display:flex; justify-content:space-between; align-items:baseline; }
  .progress .top span:first-child{ font-size:12.5px; color:var(--muted); font-weight:600; }
  .progress .top span:last-child{ font-family:var(--font-mono); font-size:13.5px; font-weight:600; }
  .progress .bar{ height:6px; background:var(--line); border-radius:99px; margin-top:11px; overflow:hidden; }
  .progress .fill{ height:100%; background:var(--red); border-radius:99px; width:0%; transition:width .25s ease; }
  .prep-caption{ font-size:11.5px; color:var(--muted-2); margin:-8px 0 18px; padding-left:2px; }

  /* ===== NAV ===== */
  .bottomnav{ display:flex; border-top:1px solid var(--line); background:#fff;
    padding-bottom:env(safe-area-inset-bottom); z-index:600; }
  .navbtn{ flex:1; border:none; background:none; padding:11px 4px 10px; display:flex; flex-direction:column;
    align-items:center; gap:5px; color:var(--muted-2); cursor:pointer; }
  .navbtn .icon{ width:20px; height:20px; }
  .navbtn .lb{ font-size:10.5px; font-weight:600; }
  .navbtn.active{ color:var(--ink); }
  .navbtn.active .icon{ color:var(--red); }

  /* ===== MODAL ===== */
  .modal-bg{ position:fixed; inset:0; background:rgba(26,26,30,.5); display:none;
    align-items:flex-end; justify-content:center; z-index:1000; }
  .modal-bg.open{ display:flex; }
  .modal{ width:100%; max-width:520px; background:#fff; border-radius:24px 24px 0 0;
    max-height:86vh; overflow-y:auto; padding:22px 20px 26px; position:relative; }
  .modal h2{ font-size:18px; font-weight:700; margin:0 0 5px; letter-spacing:-.02em; }
  .modal .sub{ font-size:12.5px; color:var(--muted); margin:0 0 16px; line-height:1.6; }
  .modal-close{ position:absolute; top:18px; right:18px; border:none; background:var(--tint);
    border-radius:50%; width:28px;height:28px; cursor:pointer; color:var(--muted);
    display:flex;align-items:center;justify-content:center; }
  .sugg-card{ background:var(--tint); border-radius:var(--r-md); padding:14px; margin-bottom:8px; }
  .sugg-card .name{ font-weight:700; font-size:14.5px; }
  .sugg-card .cat{ font-size:11px; color:var(--red); font-weight:700; margin:3px 0 7px; }
  .sugg-card .reason{ font-size:12.5px; color:var(--muted); line-height:1.6; margin-bottom:11px; }
  .sugg-add{ border:none; background:var(--ink); color:#fff; font-size:12px; font-weight:600;
    padding:8px 13px; border-radius:999px; cursor:pointer; }
  .ai-status{ font-size:12px; color:var(--muted); margin:12px 0; min-height:18px; line-height:1.55; }
  .ai-choice{ display:flex; gap:8px; }
  .ai-choice .btn-primary{ flex:1; min-width:0; padding:13px 10px; font-size:13px; }
  .ai-choice .btn-primary.disabled{ background:var(--line-2); color:#fff; cursor:not-allowed; }
  .ai-error{ color:var(--red); }

  .disabled-box{ background:var(--tint); border:1px dashed var(--line-2); border-radius:var(--r-md);
    padding:20px 16px; text-align:center; }
  .disabled-box .dtitle{ font-size:14px; font-weight:700; margin-bottom:7px; color:var(--red); }
  .disabled-box .ddesc{ font-size:12px; color:var(--muted); line-height:1.7; }
  .field-lbl{ display:block; font-size:11.5px; color:var(--muted); font-weight:600; margin:16px 0 6px; }
  .key-input{ width:100%; padding:11px 13px; border-radius:var(--r-sm); border:1px solid var(--line-2);
    font-size:14px; background:var(--tint); font-family:inherit; }
  .link-btn{ border:none; background:none; color:var(--muted); font-size:11.5px; font-weight:600;
    text-decoration:underline; cursor:pointer; padding:8px 0 0; display:block; }
  code{ background:var(--tint); border:1px solid var(--line-2); border-radius:5px; padding:1px 5px;
    font-family:var(--font-mono); font-size:11px; }

  .status-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0;
    border-bottom:1px solid var(--line); font-size:13.5px; }
  .status-row:last-of-type{ border-bottom:none; }
  .status-row .k{ font-weight:600; }
  .status-row .v{ font-size:11.5px; font-weight:600; border-radius:999px; padding:5px 11px; }
  .v.on{ background:var(--red-soft); color:var(--red); }
  .v.off{ background:var(--tint); color:var(--muted); }

  .share-box{ display:flex; gap:8px; margin-top:6px; }
  .share-box input{ flex:1; padding:11px 13px; border-radius:var(--r-sm); border:1px solid var(--line-2);
    font-size:12px; background:var(--tint); font-family:var(--font-mono); min-width:0; }
  .share-box button{ flex:0 0 auto; border:none; border-radius:var(--r-sm); background:var(--ink);
    color:#fff; padding:0 16px; font-size:12.5px; font-weight:700; cursor:pointer; }

  /* toast */
  .toast{ position:fixed; left:50%; bottom:86px; transform:translate(-50%, 16px);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px;
    font-size:12.5px; font-weight:600; z-index:2000; opacity:0; pointer-events:none;
    transition:opacity .22s ease, transform .22s ease; max-width:86vw; text-align:center; }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">

  <!-- ============ MAP ============ -->
  <div class="screen active" id="screen-map">
    <div id="map"></div>
    <div id="gmap"></div>

    <div class="float-head">
      <div class="topbar">
        <div class="mark"><span class="icon" data-i="navMap"></span></div>

const DOW = ['일','월','화','수','목','금','토'];
function fmtDate(iso){ if(!iso) return '--/--'; const p=iso.split('-'); return `${p[1]}/${p[2]}`; }
function fmtDow(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return isNaN(d)? '' : DOW[d.getDay()]; }
function fmtRange(){
  const ds = TRIP.days.filter(d=>d.iso).map(d=>d.iso).sort();
  if(!ds.length) return '';
  return ds.length===1 ? ds[0].replace(/-/g,'.') : `${ds[0].replace(/-/g,'.')} – ${ds[ds.length-1].slice(5).replace('-','.')}`;
}
function toast(msg){

}
function haversineKm(a,b){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function estimateMinutes(km, mode){
  const m = MODES.find(x=>x.key===mode) || MODES[0];
  return Math.max(1, Math.round(km*1.28 / m.kmh * 60 + m.fixed));
}
function fmtMin(m){ if(m<60) return `${m}분`; const h=Math.floor(m/60), r=m%60; return r? `${h}시간 ${r}분` : `${h}시간`; }

function encodeTrip(){
  const json = JSON.stringify(TRIP);
  const bytes = new TextEncoder().encode(json);
  let bin=''; bytes.forEach(b=> bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeTrip(str){
  try{
    const b64 = str.replace(/-/g,'+').replace(/_/g,'/');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){ return null; }
}

async function cloudGet(){
  if(!HAS_SYNC) return null;
  const url = `${CFG.SUPABASE_URL.replace(/\/$/,'')}/rest/v1/trips?id=eq.${encodeURIComponent(CFG.TRIP_ID)}&select=data`;
  const res = await fetch(url, { headers:{ apikey:CFG.SUPABASE_ANON_KEY, Authorization:'Bearer '+CFG.SUPABASE_ANON_KEY } });
  if(!res.ok) throw new Error('load '+res.status);
  const rows = await res.json();
  return rows.length? rows[0].data : null;
}
async function cloudPut(){
  if(!HAS_SYNC) return;
  const url = `${CFG.SUPABASE_URL.replace(/\/$/,'')}/rest/v1/trips`;
  const res = await fetch(url, {
    method:'POST',
    headers:{
      apikey:CFG.SUPABASE_ANON_KEY, Authorization:'Bearer '+CFG.SUPABASE_ANON_KEY,
      'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal'
    },
    body: JSON.stringify([{ id:CFG.TRIP_ID, data:TRIP }])
  });
  if(!res.ok) throw new Error('save '+res.status);
}

function markChanged(){
  TRIP.updatedAt = Date.now();
  writeLocal();
  if(!HAS_SYNC) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async ()=>{
    try{ await cloudPut(); setSyncLabel('동기화됨'); }
    catch(e){ setSyncLabel('동기화 실패'); }
  }, 700);
}
function setSyncLabel(txt){
  const badge=document.getElementById('syncBadge');
  document.getElementById('syncLabel').textContent = txt;
  badge.classList.toggle('sync', HAS_SYNC && txt==='동기화됨');
}
async function pullRemote(quiet){
  if(!HAS_SYNC) return;
  try{
    const remote = await cloudGet();
    if(remote && (remote.updatedAt||0) > (TRIP.updatedAt||0)){
      if(dayFormOpen || editingStopId!==null) return;
      TRIP = remote;
      TRIP.days.forEach(d=> d.stops.forEach(st=>{ if(st.mode) st.mode = normalizeMode(st.mode); }));
      writeLocal();
      if(!dayById(activeDayId)) activeDayId = TRIP.days[0] ? TRIP.days[0].id : null;
      activeStopId=null;
      refreshAll();
      if(!quiet) toast('친구가 수정한 일정을 불러왔어요');
    }
    setSyncLabel('동기화됨');
  }catch(e){ setSyncLabel('동기화 실패'); }
}

/* ================= MAP ================= */
function initLeaflet(){
  lmap = L.map('map', { zoomControl:false, attributionControl:false }).setView([43.06,141.35], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18 }).addTo(lmap);
}
function pinHtml(num, active){
  const size = active?34:27;
  return `<div style="width:${size}px;height:${size}px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
    background:${active?'#1A1A1E':'#E03B4B'};display:flex;align-items:center;justify-content:center;
    border:2.5px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.32);">
    <span style="transform:rotate(45deg);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:${active?13:11}px;font-weight:600;">${num}</span></div>`;
}
function clearMapLayers(){
  lMarkers.forEach(m=>lmap.removeLayer(m)); lMarkers=[];
  if(lLine){ lmap.removeLayer(lLine); lLine=null; }
  gMarkers.forEach(m=>m.setMap(null)); gMarkers=[];
  if(gLine){ gLine.setMap(null); gLine=null; }
}
function renderMapForDay(){
  const day=currentDay(); clearMapLayers();
  if(!day) return;
  const withLoc = day.stops.filter(s=>!s.tbd && s.lat!=null);
  if(!withLoc.length) return;
  if(engine==='leaflet'){
    const pts=[];
    withLoc.forEach((s,i)=>{
      const active=s.id===activeStopId, size=active?34:27;
      const mk=L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:pinHtml(i+1,active),iconSize:[size,size],iconAnchor:[size/2,size-2]})}).addTo(lmap);
      mk.on('click', ()=> selectStop(s.id,true,true));
      lMarkers.push(mk); pts.push([s.lat,s.lng]);
    });
    lLine=L.polyline(pts,{color:'#1A1A1E',weight:2,opacity:.4,dashArray:'1 7'}).addTo(lmap);
    if(!activeStopId) lmap.fitBounds(L.latLngBounds(pts),{padding:[46,46],maxZoom:13});
  } else {
    const pts=[];
    withLoc.forEach((s,i)=>{
      const active=s.id===activeStopId;
      const mk=new google.maps.Marker({
        position:{lat:s.lat,lng:s.lng}, map:gmap,
        label:{text:String(i+1),color:'#fff',fontSize:'11px',fontWeight:'600'},
        icon:{ path:google.maps.SymbolPath.CIRCLE, fillColor:active?'#1A1A1E':'#E03B4B',
          fillOpacity:1, strokeColor:'#fff', strokeWeight:2.5, scale:active?15:12 }
      });
      mk.addListener('click', ()=> selectStop(s.id,true,true));
      gMarkers.push(mk); pts.push({lat:s.lat,lng:s.lng});
    });
    gLine=new google.maps.Polyline({path:pts,map:gmap,strokeColor:'#1A1A1E',strokeOpacity:.45,strokeWeight:2});
    if(!activeStopId){ const b=new google.maps.LatLngBounds(); pts.forEach(p=>b.extend(p)); gmap.fitBounds(b,60); }
  }
}
function panTo(lat,lng,zoom){
  if(engine==='leaflet') lmap.setView([lat,lng],zoom||14,{animate:true});
  else { gmap.panTo({lat,lng}); gmap.setZoom(zoom||14); }
}
function bootGoogleMaps(){
  window.__gmapReady=()=>{
    try{
      document.getElementById('map').style.display='none';
      document.getElementById('gmap').style.display='block';
      gmap=new google.maps.Map(document.getElementById('gmap'),{
        center:{lat:43.06,lng:141.35}, zoom:9, disableDefaultUI:true, gestureHandling:'greedy',
        styles:[{featureType:'poi',elementType:'labels',stylers:[{visibility:'simplified'}]},
                {featureType:'transit',elementType:'labels',stylers:[{visibility:'off'}]}]
      });
      engine='google';
      if(HAS_DIR && google.maps.DirectionsService) dirService=new google.maps.DirectionsService();
      activeStopId=null; renderMapForDay(); renderCarousel();
    }catch(e){ console.error(e); }
  };
  const sc=document.createElement('script');
  sc.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(CFG.GOOGLE_MAPS_API_KEY)}&callback=__gmapReady&language=ko&region=JP`;
  sc.async=true;
  sc.onerror=()=> console.warn('구글 지도를 불러오지 못해 기본 지도를 사용합니다.');
  document.head.appendChild(sc);
}

/* ================= CAROUSEL ================= */
function selectStop(id, fly, scrollCard){
  activeStopId=id;
  const info=stopById(id);
  if(info && !info.stop.tbd && fly) panTo(info.stop.lat, info.stop.lng, 14);
  renderMapForDay(); updateCardActive();
  if(scrollCard) scrollCardIntoCenter(id);
}
function updateCardActive(){
  document.querySelectorAll('.place-card').forEach(el=> el.classList.toggle('active', Number(el.dataset.id)===activeStopId));
}
function scrollCardIntoCenter(id){
  const wrap=document.getElementById('carousel');
  const card=wrap.querySelector(`.place-card[data-id="${id}"]`);
  if(!card) return;
  suppressScrollSync=true;
  wrap.scrollTo({ left: card.offsetLeft-(wrap.clientWidth-card.offsetWidth)/2, behavior:'smooth' });
  setTimeout(()=>{ suppressScrollSync=false; }, 500);
}
function setCarouselMetrics(){
  const wrap=document.getElementById('carousel');
  const w=wrap.clientWidth||380, cardw=Math.round(Math.min(300, w*0.78));
  wrap.style.setProperty('--cardw', cardw+'px');
  wrap.style.setProperty('--edge', ((w-cardw)/2-5)+'px');
}
function renderCarousel(){
  const day=currentDay(), wrap=document.getElementById('carousel');
  wrap.innerHTML=''; setCarouselMetrics();
  if(!day || !day.stops.length){
    wrap.innerHTML=`<div class="place-card empty">아직 일정이 없어요.<br>일정표 탭에서 장소를 추가해보세요.</div>`;
    return;
  }
  const withLoc=day.stops.filter(s=>!s.tbd && s.lat!=null);
  if(!activeStopId && withLoc.length) activeStopId=withLoc[0].id;
  day.stops.forEach(s=>{
    const idx=withLoc.indexOf(s);
    const card=document.createElement('div');
    card.className='place-card'+(s.id===activeStopId?' active':'');
    card.dataset.id=s.id;
    const rating = s.rating? `<span class="pc-rating"><span class="star">★</span> ${s.rating} <span class="rc">(리뷰 ${s.ratingCount})</span></span>`:'';
    card.innerHTML=`
      <div class="pc-top">
        <span class="pc-num ${s.tbd?'tbd':''}">${idx>=0? idx+1:'–'}</span>
        <span class="pc-time">${s.time}</span>
        <span class="pc-chip"><span class="icon">${iconSvg(CATS[s.cat])}</span>${s.cat}</span>
      </div>
      <div class="pc-name">${esc(s.name)}</div>
      <div class="pc-note">${esc(s.note||'')}</div>
      <div class="pc-foot">${rating}${s.tbd?'<span class="tbd-badge">위치 미정</span>':''}</div>`;
    card.addEventListener('click', ()=> selectStop(s.id,true,true));
    wrap.appendChild(card);
  });
  setTimeout(()=> scrollCardIntoCenter(activeStopId), 60);
}
function onCarouselScroll(){
  if(suppressScrollSync) return;
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{
    const wrap=document.getElementById('carousel');
    const center=wrap.scrollLeft+wrap.clientWidth/2;
    let best=null,bestD=Infinity;
    wrap.querySelectorAll('.place-card').forEach(c=>{
      const d=Math.abs((c.offsetLeft+c.offsetWidth/2)-center);
      if(d<bestD){ bestD=d; best=c; }
    });
    if(!best||!best.dataset.id) return;
    const id=Number(best.dataset.id);
    if(id!==activeStopId) selectStop(id,true,false);
  },110);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ================= DAY CHIPS ================= */
function renderDayChips(containerId, afterClick){
  const wrap=document.getElementById(containerId);
  wrap.innerHTML='';
  TRIP.days.forEach(d=>{

    el.className='daychip'+(d.id===activeDayId?' active':'');

function renderScheduleScreen(){
  const day=currentDay();
  document.getElementById('schedTitle').textContent = day? `${fmtDate(day.iso)} (${fmtDow(day.iso)}) · ${day.label}` : '일정표';
  renderDayChips('daybar-sched', ()=>{ closeForm(); closeDayForm(); renderScheduleScreen(); });

  const wrap=document.getElementById('stopListEdit'); wrap.innerHTML='';
  if(!day){ wrap.innerHTML=`<div class="empty-note">날짜가 없어요.<br>위의 "날짜" 버튼으로 여행 날짜를 추가해보세요.</div>`; return; }
  if(!day.stops.length){ wrap.innerHTML=`<div class="empty-note">이 날은 아직 일정이 비어있어요.</div>`; return; }

  const withLoc=day.stops.filter(s=>!s.tbd && s.lat!=null);
  day.stops.forEach((s,i)=>{
    const idx=withLoc.indexOf(s);
    const el=document.createElement('div'); el.className='stop';
    el.innerHTML=`
      <div class="num ${s.tbd?'tbd':''}">${idx>=0? idx+1:'?'}</div>
      <div class="body">
        <div class="time">${esc(s.time)}</div>
        <div class="name">${esc(s.name)}</div>
        <div class="note">${esc(s.note||'')}</div>
        ${s.place? `<div class="loc"><span class="icon">${iconSvg('navMap')}</span><span>${esc(s.place)}</span></div>`:''}
        <div class="row2">
          <span class="tag">${s.cat}${s.tbd?' · 위치 미정':''}</span>
          <button class="edit-btn">수정</button>
        </div>
      </div>`;
    el.querySelector('.edit-btn').addEventListener('click', ()=> openForm(s.id));
    wrap.appendChild(el);
    const next=day.stops[i+1];
    if(next) wrap.appendChild(buildLeg(s,next));
  });
}

function buildLeg(from,to){
  const leg=document.createElement('div'); leg.className='leg';
  const both = !from.tbd && !to.tbd && from.lat!=null && to.lat!=null;
  const km = both? haversineKm(from,to):null;
  const cur = normalizeMode(from.mode);

  const modesHtml = MODES.map(m=>{
    const mins = both? estimateMinutes(km,m.key):null;
    return `<button class="mode ${m.key===cur?'active':''}" data-mode="${m.key}">
      <span class="icon">${iconSvg(m.icon)}</span>${m.label}
      ${mins!=null? `<span class="mins" data-mins="${m.key}">${fmtMin(mins)}</span>`:''}</button>`;
  }).join('');

  let meta;
  if(!both) meta='양쪽 위치가 모두 정해지면 소요시간이 계산돼요';
  else if(HAS_DIR) meta=`직선거리 약 ${km.toFixed(1)}km · 실제 경로를 불러오는 중입니다`;
  else meta=`직선거리 약 ${km.toFixed(1)}km · <span class="off">경로 안내 ${DISABLED_MSG}</span> 거리 기반 추정치이며 노선·요금 정보는 표시되지 않아요`;

  leg.innerHTML=`<div class="rail"><span></span></div>
    <div class="legbody">
      <div class="modes">${modesHtml}</div>
      <div class="route-detail" id="rd-${from.id}"></div>
      <div class="legmeta">${meta}</div>
    </div>`;

  leg.querySelectorAll('.mode').forEach(btn=>{
    btn.addEventListener('click', ()=>{ from.mode=btn.dataset.mode; markChanged(); renderScheduleScreen(); });
  });

  if(both && HAS_DIR) fetchDirectionsForLeg(from,to,leg,km);
  return leg;
}

/* 일정 날짜/시각을 실제 Date로 (예: 2026-09-19 + "14:00") */
function stopDateTime(iso, hhmm){
  if(!iso || !hhmm) return new Date();
  const d = new Date(`${iso}T${hhmm}:00`);
  return isNaN(d) ? new Date() : d;
}

function vehicleIcon(type){
  const t = String(type||'').toUpperCase();
  if(t.includes('SUBWAY') || t.includes('METRO')) return 'metro';
  if(t.includes('BUS')) return 'bus';
  if(t.includes('TRAM') || t.includes('RAIL') || t.includes('TRAIN')) return 'metro';
  return 'metro';
}

/* 출발까지 남은 시간 (실시간 갱신) */
function etaText(epoch){
  const diff = Math.round((epoch - Date.now())/60000);
  if(diff <= -2) return '출발함';
  if(diff <= 0)  return '곧 출발';
  if(diff < 60)  return `${diff}분 뒤`;
  const h=Math.floor(diff/60), m=diff%60;
  return m? `${h}시간 ${m}분 뒤` : `${h}시간 뒤`;
}
function tickEtas(){
  document.querySelectorAll('.rd-eta').forEach(el=>{
    const dep = Number(el.dataset.dep);
    if(!dep) return;
    el.textContent = etaText(dep);
    el.classList.toggle('soon', dep - Date.now() < 5*60*1000);
  });
}
setInterval(tickEtas, 20000);

/* 일정표를 보고 있는 동안 1분마다 경로를 다시 불러옵니다 */
setInterval(()=>{
  if(!HAS_DIR) return;
  if(document.hidden) return;
  if(!document.getElementById('screen-schedule').classList.contains('active')) return;
  if(dayFormOpen || editingStopId!==null) return;
  for(const k in dirCache) delete dirCache[k];
  renderScheduleScreen();
}, 60000);

function fetchDirectionsForLeg(from,to,legEl,km){
  if(!dirService) return;
  const metaEl   = legEl.querySelector('.legmeta');
  const detailEl = legEl.querySelector('.route-detail');
  const dayIso   = (currentDay()||{}).iso;
  const depart   = new Date();                 // 지금 시각 기준으로 조회
  const bucket   = Math.floor(Date.now()/(60*1000));    // 1분마다 새로 조회

  const needed=[...new Set(MODES.map(m=>m.g))];
  let pending=needed.length; const results={};

  needed.forEach(g=>{
    const ck=`${from.lat},${from.lng}|${to.lat},${to.lng}|${g}|${g==='TRANSIT'? bucket : 'static'}`;
    if(dirCache[ck]!==undefined){ results[g]=dirCache[ck]; if(--pending===0) apply(); return; }
    const req={ origin:{lat:from.lat,lng:from.lng}, destination:{lat:to.lat,lng:to.lng}, travelMode:google.maps.TravelMode[g] };
    if(g==='TRANSIT') req.transitOptions={ departureTime: depart };
    dirService.route(req,(res,status)=>{
      let out=null;
      if(status==='OK' && res.routes[0] && res.routes[0].legs[0]){
        const route=res.routes[0], lg=route.legs[0];
        out = {
          mins: Math.round(lg.duration.value/60),
          fare: route.fare ? route.fare.text : null,
          depart: lg.departure_time ? lg.departure_time.text : null,
          departAt: lg.departure_time && lg.departure_time.value ? lg.departure_time.value.getTime() : null,
          arrive: lg.arrival_time ? lg.arrival_time.text : null,
          steps: (lg.steps||[]).map(st=>{
            if(st.travel_mode==='TRANSIT' && st.transit){
              const line=st.transit.line||{};
              return {
                kind:'transit',
                name: line.short_name || line.name || '노선',
                full: line.name || '',
                vehicle: (line.vehicle && (line.vehicle.type || line.vehicle.name)) || '',
                color: line.color || null,
                from: (st.transit.departure_stop||{}).name || '',
                to: (st.transit.arrival_stop||{}).name || '',
                depart: st.transit.departure_time ? st.transit.departure_time.text : null,
                departAt: st.transit.departure_time && st.transit.departure_time.value ? st.transit.departure_time.value.getTime() : null,
                stops: st.transit.num_stops || 0
              };
            }
            return { kind:'walk', mins: Math.round((st.duration? st.duration.value:0)/60) };
          })
        };
      }
      dirCache[ck]=out; results[g]=out;
      if(--pending===0) apply();
    });
  });

  function apply(){
    let anyReal=false;
    MODES.forEach(m=>{
      const el=legEl.querySelector(`.mins[data-mins="${m.key}"]`);
      if(!el) return;
      const r=results[m.g];
      if(r && r.mins!=null){ el.textContent=fmtMin(r.mins); anyReal=true; }
    });

    const cur = normalizeMode(from.mode);
    const r = results[(MODES.find(m=>m.key===cur)||MODES[0]).g];

    if(r){
      const bits=[];
      if(r.depart && r.arrive){
        bits.push(`<span class="rd-time">${esc(r.depart)} – ${esc(r.arrive)}</span>`);
      }
      if(r.fare) bits.push(`<span class="rd-fare">${esc(r.fare)}</span>`);

      let chain='';
      if(cur==='transit' && r.steps && r.steps.length){
        const parts = r.steps.filter(st=> st.kind==='transit' || st.mins>=1).map(st=>{
          if(st.kind==='walk') return `<span class="rd-seg walk"><span class="icon">${iconSvg('walk')}</span>${st.mins}분</span>`;
          const style = st.color ? ` style="border-color:${esc(st.color)};color:${esc(st.color)}"` : '';
          return `<span class="rd-seg line"${style}><span class="icon">${iconSvg(vehicleIcon(st.vehicle))}</span>${esc(st.name)}</span>`;
        });
        if(parts.length) chain=`<div class="rd-chain">${parts.join('<span class="rd-arrow">›</span>')}</div>`;

        const first = r.steps.find(st=>st.kind==='transit');
        if(first && first.depart){
          const eta = first.departAt
            ? `<span class="rd-eta" data-dep="${first.departAt}">${etaText(first.departAt)}</span>` : '';
          bits.push(`<span class="rd-board">${esc(first.depart)} ${esc(first.from)} 출발</span>${eta}`);
        }
      }

      detailEl.innerHTML = (bits.length||chain)
        ? `<div class="rd-head">${bits.join('<span class="rd-dot">·</span>')}</div>${chain}` : '';
      tickEtas();
    } else {
      detailEl.innerHTML='';
    }

    if(!anyReal){
      metaEl.innerHTML=`직선거리 약 ${km.toFixed(1)}km · 경로를 찾지 못해 추정치로 표시됩니다`;
    } else {
      const isTrip = dayIso === new Date().toISOString().slice(0,10);
      metaEl.innerHTML = `직선거리 약 ${km.toFixed(1)}km · 구글 경로 기준`
        + (normalizeMode(from.mode)==='transit'
            ? (isTrip ? ' · <b>지금 출발</b> 기준 실시간 운행 정보'
                      : ' · <b>지금 출발</b> 기준이라 여행 당일에는 시간표가 다를 수 있어요')
            : '');
    }
  }
}

/* ================= DAY FORM ================= */
function openDayForm(mode){
  closeForm(); dayFormOpen=true;
  const editing = mode==='edit' ? currentDay() : null;
  if(mode==='edit' && !editing){ toast('편집할 날짜가 없어요'); dayFormOpen=false; return; }
  const defIso = editing? editing.iso : nextSuggestedIso();
  document.getElementById('formArea').innerHTML=`
    <div class="form-card">
      <h3>${editing? '날짜 편집':'날짜 추가'}</h3>
      <label class="first">날짜</label>
      <input type="date" id="d_iso" value="${defIso}">
      <label>이 날의 테마</label>
      <input type="text" id="d_label" value="${editing? esc(editing.label):''}" placeholder="예: 오타루 당일치기">
      <div class="form-actions">
        <button class="btn-primary" id="d_save">${editing? '저장':'추가'}</button>
        <button class="btn-ghost" id="d_cancel">취소</button>
        ${editing? '<button class="btn-ghost btn-danger" id="d_delete">이 날 삭제</button>':''}
      </div>
      ${editing? '<p class="hint">날짜를 삭제하면 그 날의 일정도 함께 사라져요.</p>':''}
    </div>`;
  document.getElementById('d_save').addEventListener('click', ()=> saveDay(editing));
  document.getElementById('d_cancel').addEventListener('click', ()=>{ closeDayForm(); });
  if(editing) document.getElementById('d_delete').addEventListener('click', ()=> deleteDay(editing));
  document.getElementById('formArea').scrollIntoView({behavior:'smooth',block:'start'});
}
function nextSuggestedIso(){
  if(!TRIP.days.length) return new Date().toISOString().slice(0,10);
  const last = TRIP.days.map(d=>d.iso).filter(Boolean).sort().pop();
  const d = new Date(last+'T00:00:00'); d.setDate(d.getDate()+1);
  return d.toISOString().slice(0,10);
}
function closeDayForm(){ dayFormOpen=false; const a=document.getElementById('formArea'); if(a) a.innerHTML=''; }
function saveDay(editing){
  const iso=document.getElementById('d_iso').value;
  const label=document.getElementById('d_label').value.trim() || '일정';
  if(!iso){ alert('날짜를 선택해주세요.'); return; }
  if(editing){ editing.iso=iso; editing.label=label; }
  else {
    const nd={ id:TRIP.nextDayId++, iso, label, stops:[] };
    TRIP.days.push(nd); activeDayId=nd.id;
  }
  sortDays(); markChanged(); closeDayForm();
  activeStopId=null;
  refreshAll();
  toast(editing? '날짜를 수정했어요':'날짜를 추가했어요');
}
function deleteDay(day){
  if(TRIP.days.length<=1){ alert('마지막 날짜는 삭제할 수 없어요.'); return; }
  if(!confirm(`${fmtDate(day.iso)} 일정을 통째로 삭제할까요?`)) return;
  TRIP.days=TRIP.days.filter(d=>d.id!==day.id);
  activeDayId=TRIP.days[0].id; activeStopId=null;

  toast('날짜를 삭제했어요');
}

async function doGeoSearch(){
  const q=document.getElementById('f_geoQuery').value.trim();
  const st=document.getElementById('f_geoStatus'), rs=document.getElementById('f_geoResults');
  if(!q){ st.textContent='검색어를 입력해주세요.'; return; }
  st.textContent='검색 중입니다.'; rs.innerHTML='';
  try{
    const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(q)}`,{headers:{'Accept-Language':'ko'}});
    const data=await res.json();
    if(!data.length){ st.textContent='검색 결과가 없어요. 다른 검색어로 시도해보세요.'; return; }
    st.textContent='아래에서 위치를 선택하세요.';
    data.forEach(r=>{
      const b=document.createElement('button');
      b.type='button'; b.className='geo-result'; b.textContent=r.display_name;
      b.addEventListener('click', ()=>{
        geoPicked={lat:parseFloat(r.lat),lng:parseFloat(r.lon),label:r.display_name};
        document.querySelectorAll('.geo-result').forEach(x=>x.classList.remove('picked'));
        b.classList.add('picked'); st.textContent='이 위치로 저장됩니다.';
      });
      rs.appendChild(b);
    });
  }catch(e){ st.textContent='검색 중 오류가 발생했어요. 네트워크 문제일 수 있어요.'; }
}
function shortPlace(l){ return l? l.split(',').map(x=>x.trim()).slice(0,3).join(', '):''; }
function saveForm(){
  const name=document.getElementById('f_name').value.trim();
  const time=document.getElementById('f_time').value.trim();
  const cat=document.getElementById('f_cat').value;
  const note=document.getElementById('f_note').value.trim();
  if(!name||!time){ alert('이름과 시간은 꼭 입력해주세요.'); return; }
  const day=currentDay();
  if(editingStopId){
    const s=day.stops.find(x=>x.id===editingStopId);
    s.name=name; s.time=time; s.cat=cat; s.note=note;
    if(geoPicked){ s.lat=geoPicked.lat; s.lng=geoPicked.lng; s.place=shortPlace(geoPicked.label); s.tbd=false; }
  } else {
    const ns={id:newUid(),time,name,note,cat,mode:'walk'};
    if(geoPicked){ ns.lat=geoPicked.lat; ns.lng=geoPicked.lng; ns.place=shortPlace(geoPicked.label); ns.tbd=false; }
    else ns.tbd=true;
    day.stops.push(ns);
  }
  day.stops.sort((a,b)=>a.time.localeCompare(b.time));
  markChanged();
  editingStopId=null; geoPicked=null;
  document.getElementById('formArea').innerHTML='';
  activeStopId=null; renderScheduleScreen();
  toast('저장했어요');
}
function deleteStop(id){
  if(!confirm('이 일정을 삭제할까요?')) return;
  const day=currentDay();
  day.stops=day.stops.filter(x=>x.id!==id);
  markChanged();
  editingStopId=null;
  document.getElementById('formArea').innerHTML='';
  renderScheduleScreen();
}

let prepState={};

function renderPrep(){
  const wrap=document.getElementById('prepGroups'); wrap.innerHTML='';
  let total=0,done=0;
  PREP.forEach((g,gi)=>{
    const gEl=document.createElement('div'); gEl.className='prep-group';
    gEl.innerHTML=`<h2>${g.group}</h2>`;
    g.items.forEach((it,ii)=>{
      const key=gi+'-'+ii; total++; if(prepState[key]) done++;
      const row=document.createElement('div');
      row.className='prep-item'+(prepState[key]?' done':'');
      row.innerHTML=`<div class="box">${prepState[key]? `<span class="icon" style="width:12px;height:12px">${iconSvg('navCheck')}</span>`:''}</div>
        <div><div class="t">${it.t}</div><div class="d">${it.d}</div></div>`;
      row.addEventListener('click', ()=>{ prepState[key]=!prepState[key]; savePrep(); renderPrep(); });
      gEl.appendChild(row);
    });
    wrap.appendChild(gEl);
  });
  document.getElementById('prepCount').textContent=`${done} / ${total}`;
  document.getElementById('prepFill').style.width= total? (done/total*100)+'%':'0%';
}

function buildAiPayload(day, kind){
  const payload = {
    city: '삿포로',
    date: `${fmtDate(day.iso)} (${fmtDow(day.iso)})`,
    theme: day.label||'',
    stops: day.stops.map(s=>({ time:s.time, name:s.name, cat:s.cat, note:s.note||'' }))
  };
  if(kind==='next'){
    const i = day.stops.findIndex(x=>x.id===activeStopId);
    const cur  = day.stops[i];
    const next = day.stops[i+1];
    if(cur){
      payload.focus = {
        after: cur.name,
        afterTime: cur.time,
        before: next? next.name : null,
        beforeTime: next? next.time : null
      };
    }
  }
  return payload;
}

function buildAiPrompt(day, kind){
  const text = day.stops.map(s=>`${s.time} ${s.name} (${s.cat})${s.note? ' - '+s.note:''}`).join('\n');
  const head = `오늘(${fmtDate(day.iso)} ${fmtDow(day.iso)}, 테마: ${day.label}) 일정입니다.\n${text}\n\n`;
  if(kind==='next'){
    const i = day.stops.findIndex(x=>x.id===activeStopId);
    const cur=day.stops[i], next=day.stops[i+1];
    if(cur && next) return head + `"${cur.name}"(${cur.time})을 마치고 "${next.name}"(${next.time})로 가기 전에 들를 만한 곳을 추천해줘. 두 장소 사이 동선에서 크게 벗어나지 않고, 남는 시간에 맞는 곳으로.`;
    if(cur) return head + `"${cur.name}"(${cur.time}) 다음에 이어서 갈 만한 곳을 추천해줘. 도보나 짧은 대중교통으로 갈 수 있는 거리로.`;
  }
  return head + `이 동선에 자연스럽게 어울리는 장소를 추천해줘.`;
}

async function runAiRecommend(kind){
  kind = kind || 'day';
  const st=document.getElementById('aiStatus'), rs=document.getElementById('aiResults');
  const day=currentDay();
  if(!day){ st.textContent='날짜가 없어요.'; return; }
  rs.innerHTML=''; st.textContent='추천을 불러오는 중입니다.'; st.className='ai-status';

  try{
    let list;
    if(aiMode()==='proxy'){
      const res=await fetch(CFG.AI_PROXY_URL,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(buildAiPayload(day, kind))
      });
      if(res.status===429){ st.textContent='요청이 너무 많아요. 잠시 후 다시 시도해주세요.'; st.className='ai-status ai-error'; return; }
      if(!res.ok){ st.textContent=`요청이 실패했어요 (${res.status}). 관리자에게 프록시 주소 확인을 요청해주세요.`; st.className='ai-status ai-error'; return; }
      const data=await res.json();
      list = Array.isArray(data) ? data : (data.items||data.places||[]);
    } else {
      const res=await fetch('https://api.openai.com/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+personalKey()},
        body:JSON.stringify({ model:CFG.OPENAI_MODEL, temperature:0.7, messages:[
          {role:'system', content:'너는 삿포로 현지 여행 코디네이터야. 사용자가 준 하루 일정을 참고해서, 동선상 어울리는 장소(카페, 포토스팟, 소품샵, 작은 명소 등) 3에서 5곳을 추천해. 반드시 JSON 배열만 출력하고 다른 텍스트는 쓰지마. 형식: [{"name":"장소명","category":"관광|식사|휴식|선택 중 하나","reason":"추천 이유, 한국어 1에서 2문장"}]'},
          {role:'user', content: buildAiPrompt(day, kind)}
        ]})
      });
      if(res.status===401){ st.textContent='키가 올바르지 않아요. 저장된 키를 삭제하고 다시 입력해주세요.'; st.className='ai-status ai-error'; return; }
      if(!res.ok){ st.textContent=`요청이 실패했어요 (${res.status}). 키와 모델명(${esc(CFG.OPENAI_MODEL)})을 확인해주세요.`; st.className='ai-status ai-error'; return; }
      const data=await res.json();
      let content=(data.choices&&data.choices[0]&&data.choices[0].message? data.choices[0].message.content:'').replace(/```json|```/g,'').trim();
      try{ list=JSON.parse(content); }
      catch(e){ st.textContent='응답을 해석하지 못했어요. 모델이 JSON 형식을 지키지 않았을 수 있어요.'; st.className='ai-status ai-error'; return; }
    }

    if(!list || !list.length){ st.textContent='추천 결과가 비어있어요.'; st.className='ai-status ai-error'; return; }
    st.textContent=`${list.length}곳을 추천받았어요.`;
    list.forEach(item=>{
      const c=document.createElement('div'); c.className='sugg-card';
      c.innerHTML=`<div class="name">${esc(item.name)}</div><div class="cat">${esc(item.category||'')}</div>
        <div class="reason">${esc(item.reason||'')}</div><button class="sugg-add">일정표에 추가하기</button>`;
      c.querySelector('.sugg-add').addEventListener('click', ()=> addSuggestion(item));
      rs.appendChild(c);
    });
  }catch(e){
    st.textContent='네트워크 오류가 발생했어요. 잠시 후 다시 시도해주세요.';
    st.className='ai-status ai-error';
  }
}
function addSuggestion(item){
  aiModalBg.classList.remove('open');
  switchScreen('schedule'); openForm(null);
  document.getElementById('f_name').value=item.name;
  document.getElementById('f_note').value=item.reason||'';
  document.getElementById('f_cat').value = Object.keys(CATS).includes(item.category)? item.category:'관광';
  document.getElementById('f_geoQuery').value=item.name+' 삿포로';
}

/* ================= INIT ================= */
async function init(){
  mountIcons();
  document.getElementById('aiFabIcon').innerHTML=iconSvg('star');
  initLeaflet();
  loadPrep();

  // 1) 공유 링크로 들어온 경우
  const m = location.hash.match(/#trip=(.+)$/);
  if(m){
    const shared = decodeTrip(m[1]);
    if(shared && shared.days){
      TRIP = shared; writeLocal();
      history.replaceState(null,'',location.pathname);
      setTimeout(()=> toast('공유받은 일정을 불러왔어요'), 400);
    }
  } else {
    const local = readLocal();
    if(local && local.days) TRIP = local;
  }

  // 예전 버전 데이터 호환: 지하철/버스 → 대중교통
  TRIP.days.forEach(d=> d.stops.forEach(st=>{ if(st.mode) st.mode = normalizeMode(st.mode); }));
  sortDays();
  activeDayId = TRIP.days.length? TRIP.days[0].id : null;
  setSyncLabel(HAS_SYNC? '동기화 중...' : '내 기기 저장');

  if(HAS_GMAP) bootGoogleMaps();
  if(!aiUsable()) document.getElementById('aiFab').classList.add('off');

  refreshAll();
  switchScreen('map');

  // 2) 클라우드 동기화
  if(HAS_SYNC){
    await pullRemote(true);
    if(!TRIP.updatedAt){ markChanged(); }
    syncTimer = setInterval(()=> pullRemote(false), 15000);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pullRemote(false); });
  }

  // 3) 앱처럼 쓰기 위한 서비스워커
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
init();
</script>
